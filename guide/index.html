<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dokebising Guide</title>
<link rel="icon" href="img/icon.png">
<style>
:root{--bg:#17122b;--bg2:#211a3c;--card:#251d42;--line:#3a3058;--text:#f3effa;--muted:#b9b0cf;--pink:#ff5c8a;--pink2:#ff8db0;--cyan:#38d6c7}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans KR","Noto Sans JP","Noto Sans SC","Noto Sans Arabic","Noto Sans Devanagari","Noto Sans Thai",sans-serif;
 background:radial-gradient(900px 600px at 85% -10%,rgba(110,80,220,.35),transparent 70%),radial-gradient(800px 600px at 0% 40%,rgba(255,92,138,.14),transparent 70%),var(--bg);
 color:var(--text);line-height:1.65;font-size:16px}
a{color:var(--pink2)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{padding:28px 0 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}
.brand img{width:44px;height:44px;border-radius:12px}
.lang{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px;max-width:60vw}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center;padding:28px 0 12px}
.hero h1{font-size:clamp(28px,4.4vw,44px);line-height:1.2;font-weight:800}
.hero p{color:var(--muted);font-size:clamp(16px,2vw,19px);margin-top:14px}
.hero .char{width:100%;max-width:360px;justify-self:center;border-radius:28px;
 -webkit-mask-image:radial-gradient(closest-side,#000 70%,transparent 100%);mask-image:radial-gradient(closest-side,#000 70%,transparent 100%)}
.play{display:inline-flex;align-items:center;gap:10px;margin-top:22px;background:var(--pink);color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px}
nav.toc{margin:18px 0 8px;display:flex;flex-wrap:wrap;gap:8px}
nav.toc a{font-size:14px;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
section{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:24px;padding:28px;margin:22px 0;
 display:grid;grid-template-columns:1fr 260px;gap:28px;align-items:start;scroll-margin-top:16px}
section.noimg{grid-template-columns:1fr}
section h2{font-size:clamp(21px,2.6vw,26px);margin-bottom:12px}
section p{color:var(--text)}
ul{list-style:none;margin-top:10px;display:grid;gap:10px}
li{position:relative;padding-inline-start:22px;color:var(--text)}
li::before{content:"";position:absolute;inset-inline-start:4px;top:.65em;width:8px;height:8px;border-radius:50%;background:var(--pink)}
.tabs li{padding-inline-start:0}.tabs li::before{display:none}
.ui{display:inline-block;background:rgba(255,92,138,.16);border:1px solid rgba(255,141,176,.5);color:#ffd3e1;border-radius:8px;padding:0 7px;font-weight:700;font-size:.95em;white-space:nowrap}
.tabs .ui{min-width:7.5em;text-align:center;margin-inline-end:10px}
.shot{width:100%;max-width:260px;justify-self:center;border-radius:28px;border:6px solid #0d0b14;box-shadow:0 0 0 2px var(--line),0 20px 50px rgba(0,0,0,.45)}
.faq li{color:var(--muted)}
footer{color:var(--muted);font-size:14px;padding:26px 0 48px;text-align:center}
@media (max-width:760px){
 .hero{grid-template-columns:1fr}.hero .char{max-width:240px;order:-1}
 section{grid-template-columns:1fr;padding:22px}.shot{max-width:240px}
}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <div class="top">
   <div class="brand"><img src="img/icon.png" alt=""><span>Dokebising</span></div>
   <label class="lang"><span id="langLabel">Language</span>
    <select id="lang" aria-label="Language"></select></label>
  </div>
  <div class="hero">
   <div>
    <h1 id="title"></h1>
    <p id="subtitle"></p>
    <a class="play" href="https://play.google.com/store/apps/details?id=com.dokebimaster.dokebising" target="_blank" rel="noopener">▶ Google Play</a>
   </div>
   <img class="char" src="img/dokkaebi.jpg" alt="">
  </div>
  <nav class="toc" id="toc"></nav>
 </header>
 <main id="main"></main>
 <footer id="footer"></footer>
</div>
<script>
const DATA={"ko-KR": {"t": {"lang_name": "한국어", "title": "도깨비씽 사용 설명서", "subtitle": "내 폰에 있는 노래에서 목소리를 빼고, 반주에 맞춰 노래해 보세요.", "toc": "목차", "select_lang": "언어", "s_intro_t": "도깨비씽이란?", "s_intro_b": "도깨비씽은 AI로 폰에 저장된 노래 파일에서 목소리(보컬)를 분리해 반주(MR)만 남겨 주는 앱이에요. 가사를 보며 노래하고, 내 목소리를 녹음해 나만의 커버곡으로 저장할 수 있어요. 모든 처리는 폰 안에서 이루어지고 음원이 서버로 올라가지 않아요.", "s_pick_t": "1. 노래 고르기", "s_pick_b": "메인 화면 위쪽의 5개 탭에서 노래를 고르세요.", "tab_recent_d": "이미 분리한 노래예요. 기다림 없이 바로 열려요.", "tab_fav_d": "하트를 눌러 둔 노래예요.", "tab_all_d": "폰에 있는 모든 음악 파일이에요.", "tab_phone_d": "폰의 폴더를 직접 찾아 파일을 고를 수 있어요.", "tab_rec_d": "저장한 녹음 파일을 들을 수 있어요.", "s_start_t": "2. 시작하고 목소리 빼기", "s_start_b1": "노래를 고르고 {start} 버튼을 누르세요.", "s_start_b2": "처음 새 노래 3곡까지는 광고 없이 시작해요. 그다음부터는 {watch_ad}를 누르거나 {subscribe}로 광고 없이 쓸 수 있어요.", "s_start_b3": "AI가 폰 안에서 목소리를 분리해요. 곡 길이 정도 걸리고, 앞부분이 준비되면 바로 재생할 수 있어요.", "s_play_t": "3. 재생 화면", "play_b1": "가운데 분홍색 버튼으로 재생하거나 멈춰요.", "play_b2": "{vocal}: 켜면 원곡 목소리가 가이드로 나오고, 끄면 반주만 나와요.", "play_b3": "{show_score}: 켜 두면 한 번 부를 때마다 점수가 나와요.", "play_b4": "가사가 노래에 맞춰 넘어가요. 연필 버튼으로 가사를 고칠 수 있어요.", "s_rec_t": "4. 노래하고 녹음하기", "s_rec_b": "재생을 누르면 녹음도 자동으로 시작돼요. 빨간 파형이 내 목소리예요. 버튼을 다시 누르면 멈춰요.", "s_score_t": "5. 점수 확인", "s_score_b": "{show_score}가 켜져 있으면 녹음이 끝날 때 점수가 나와요. {ok}을 누르면 닫혀요.", "s_save_t": "6. 녹음 저장하기", "save_b1": "녹음한 뒤 재생 화면 아래쪽의 다운로드 버튼을 누르세요.", "save_b2": "화살표로 내 목소리와 반주의 싱크를 미세 조정할 수 있어요.", "save_b3": "{save}: 섞은 노래를 폰에 오디오 파일로 저장해요.", "save_b4": "{save_cloud}: Google 드라이브 같은 클라우드에 저장해요.", "save_b5": "제목 옆 연필 버튼으로 이름을 바꿀 수 있어요.", "s_lib_t": "7. 저장된 노래 관리", "s_lib_b": "분리한 노래는 {recent} 탭에 자동으로 저장돼서 다시 기다릴 필요가 없어요. 하트를 누르면 {favorites} 탭에 추가되고, 휴지통으로 지울 수 있어요. 저장한 녹음은 {recordings} 탭에서 들을 수 있어요.", "s_faq_t": "도움말 & 자주 묻는 질문", "faq1": "가사: MP3 파일에 들어 있는 가사를 보여줘요. 노래와 같은 이름의 .lrc 파일을 같은 폴더에 두면 노래에 맞춰 가사가 넘어가요.", "faq2": "화면이 꺼져 있으면 분리가 느려져요. 가장 빠르게 하려면 화면을 켜 두세요.", "faq3": "개인정보: 노래와 녹음은 폰 안에만 있고 서버로 보내지 않아요.", "faq4": "권한: 노래 목록을 보려면 음악 접근 권한이, 녹음하려면 마이크 권한이 필요해요.", "faq5": "본인이 가진 음원을 개인 연습용으로만 사용해 주세요. 분리한 음원을 공개적으로 배포하면 저작권 침해가 될 수 있어요."}, "lab": {"start": "시작", "watch_ad": "광고 보고 시작하기", "subscribe": "구독하기", "vocal": "보컬", "show_score": "점수 보기", "save": "저장", "save_cloud": "클라우드 저장", "recent": "최근", "favorites": "즐겨찾기", "all_songs": "모든 노래", "my_phone": "내 폰에서", "recordings": "녹음목록", "ok": "확인", "privacy": "개인정보처리방침"}, "img": {"02_allsongs": "img/ko-KR/02_allsongs.jpg", "03_gate": "img/ko-KR/03_gate.jpg", "04_play": "img/ko-KR/04_play.jpg", "05_playing": "img/ko-KR/05_playing.jpg", "06_score": "img/ko-KR/06_score.jpg", "07_export": "img/ko-KR/07_export.jpg", "01_recent": "img/ko-KR/01_recent.jpg"}, "rtl": false}, "en-US": {"t": {"lang_name": "English", "title": "Dokebising User Guide", "subtitle": "Remove the vocals from songs on your phone and sing along to the instrumental.", "toc": "Contents", "select_lang": "Language", "s_intro_t": "What is Dokebising?", "s_intro_b": "Dokebising uses AI to separate the vocals from music files stored on your phone, leaving just the instrumental. Sing along with the lyrics, record your voice and save your own cover. All processing happens on your phone — your music is never uploaded.", "s_pick_t": "1. Pick a song", "s_pick_b": "Choose a song from one of the five tabs at the top of the main screen.", "tab_recent_d": "Songs you have already separated. They open instantly.", "tab_fav_d": "Songs you marked with the heart.", "tab_all_d": "All music files on your phone.", "tab_phone_d": "Browse your phone's folders to find a file.", "tab_rec_d": "Listen to the recordings you saved.", "s_start_t": "2. Start and remove the vocals", "s_start_b1": "Select a song and press {start}.", "s_start_b2": "Your first 3 new songs start without ads. After that, choose {watch_ad} or {subscribe} for an ad-free experience.", "s_start_b3": "The AI removes the vocals on your phone. It takes roughly as long as the song, and you can start playing as soon as the first part is ready.", "s_play_t": "3. The play screen", "play_b1": "Press the big pink button to play or stop.", "play_b2": "{vocal}: turn on to hear the original singer as a guide, turn off to sing over the instrumental only.", "play_b3": "{show_score}: when on, you get a score after each take.", "play_b4": "Lyrics scroll along with the song. Tap the pencil to edit them.", "s_rec_t": "4. Sing and record", "s_rec_b": "Recording starts automatically when you press play. The red waveform shows your voice. Press the button again to stop.", "s_score_t": "5. Check your score", "s_score_b": "With {show_score} on, a score appears when a take ends. Press {ok} to close it.", "s_save_t": "6. Save your recording", "save_b1": "After recording, tap the download button at the bottom of the play screen.", "save_b2": "Use the arrows to fine-tune the sync between your voice and the instrumental.", "save_b3": "{save}: saves the mixed song as an audio file on your phone.", "save_b4": "{save_cloud}: saves it to a cloud service such as Google Drive.", "save_b5": "Tap the pencil next to the title to rename it.", "s_lib_t": "7. Your saved songs", "s_lib_b": "Separated songs are saved to the {recent} tab automatically, so you never have to wait twice. Tap the heart to add a song to the {favorites} tab, or the trash can to delete it. Saved recordings can be played in the {recordings} tab.", "s_faq_t": "Tips & FAQ", "faq1": "Lyrics: lyrics embedded in an MP3 file are shown. For synced lyrics, put a .lrc file with the same name next to the song.", "faq2": "Processing is slower when the screen is off. Keep the screen on for the fastest result.", "faq3": "Privacy: your songs and recordings stay on your phone and are never sent to our servers.", "faq4": "Permissions: the app needs access to your music to list songs and to the microphone to record.", "faq5": "Use music you own, for personal practice only. Sharing separated tracks publicly may infringe copyright."}, "lab": {"start": "Start", "watch_ad": "Watch Ad to Start", "subscribe": "Subscribe", "vocal": "Vocal", "show_score": "Show Score", "save": "Save", "save_cloud": "Save to Cloud", "recent": "Recent", "favorites": "Favorites", "all_songs": "All Songs", "my_phone": "My Phone", "recordings": "Recordings", "ok": "OK", "privacy": "Privacy Policy"}, "img": {"02_allsongs": "img/en-US/02_allsongs.jpg", "03_gate": "img/en-US/03_gate.jpg", "04_play": "img/en-US/04_play.jpg", "05_playing": "img/en-US/05_playing.jpg", "06_score": "img/en-US/06_score.jpg", "07_export": "img/en-US/07_export.jpg", "01_recent": "img/en-US/01_recent.jpg"}, "rtl": false}, "ja-JP": {"t": {"lang_name": "日本語", "title": "Dokebising 使い方ガイド", "subtitle": "スマホの曲から歌声を消して、伴奏に合わせて歌いましょう。", "toc": "目次", "select_lang": "言語", "s_intro_t": "Dokebisingとは？", "s_intro_b": "DokebisingはAIでスマホ内の音楽ファイルからボーカルを分離し、伴奏だけを残すアプリです。歌詞を見ながら歌い、自分の声を録音してカバー曲として保存できます。処理はすべてスマホ内で行われ、音源がアップロードされることはありません。", "s_pick_t": "1. 曲を選ぶ", "s_pick_b": "メイン画面上部の5つのタブから曲を選びます。", "tab_recent_d": "分離済みの曲です。待たずにすぐ開けます。", "tab_fav_d": "ハートを付けた曲です。", "tab_all_d": "スマホ内のすべての音楽ファイルです。", "tab_phone_d": "スマホのフォルダから直接ファイルを探せます。", "tab_rec_d": "保存した録音を聴けます。", "s_start_t": "2. スタートしてボーカルを消す", "s_start_b1": "曲を選んで「{start}」を押します。", "s_start_b2": "最初の新しい3曲までは広告なしで始められます。その後は「{watch_ad}」を押すか、「{subscribe}」で広告なしで使えます。", "s_start_b3": "AIがスマホ内でボーカルを分離します。曲の長さほどかかり、最初の部分が準備できればすぐ再生できます。", "s_play_t": "3. 再生画面", "play_b1": "中央のピンクのボタンで再生・停止します。", "play_b2": "「{vocal}」：オンで原曲の歌声をガイドとして聴けます。オフで伴奏だけになります。", "play_b3": "「{show_score}」：オンにすると歌うたびに点数が出ます。", "play_b4": "歌詞は曲に合わせて流れます。鉛筆ボタンで歌詞を編集できます。", "s_rec_t": "4. 歌って録音する", "s_rec_b": "再生を押すと録音も自動で始まります。赤い波形があなたの声です。もう一度ボタンを押すと止まります。", "s_score_t": "5. 点数を確認", "s_score_b": "「{show_score}」がオンなら、録音が終わると点数が表示されます。「{ok}」で閉じます。", "s_save_t": "6. 録音を保存する", "save_b1": "録音後、再生画面下のダウンロードボタンを押します。", "save_b2": "矢印で声と伴奏のタイミングを微調整できます。", "save_b3": "「{save}」：ミックスした曲を音声ファイルとしてスマホに保存します。", "save_b4": "「{save_cloud}」：Googleドライブなどのクラウドに保存します。", "save_b5": "タイトル横の鉛筆ボタンで名前を変更できます。", "s_lib_t": "7. 保存した曲", "s_lib_b": "分離した曲は「{recent}」タブに自動保存されるので、二度と待つ必要はありません。ハートで「{favorites}」タブに追加、ゴミ箱で削除できます。保存した録音は「{recordings}」タブで聴けます。", "s_faq_t": "ヒントとよくある質問", "faq1": "歌詞：MP3ファイルに埋め込まれた歌詞を表示します。曲と同じ名前の.lrcファイルを同じフォルダに置くと、歌詞が曲に合わせて流れます。", "faq2": "画面がオフだと分離が遅くなります。最速で処理するには画面をオンにしておいてください。", "faq3": "プライバシー：曲や録音はスマホ内にだけ保存され、サーバーには送信されません。", "faq4": "権限：曲の一覧表示には音楽へのアクセス、録音にはマイクの権限が必要です。", "faq5": "ご自身が所有する音源を個人の練習目的でのみご利用ください。分離した音源を公開すると著作権侵害になる場合があります。"}, "lab": {"start": "開始", "watch_ad": "広告を見て開始", "subscribe": "登録する", "vocal": "ボーカル", "show_score": "スコアを表示", "save": "保存", "save_cloud": "クラウドに保存", "recent": "最近", "favorites": "お気に入り", "all_songs": "すべての曲", "my_phone": "端末内", "recordings": "録音一覧", "ok": "OK", "privacy": "プライバシーポリシー"}, "img": {"02_allsongs": "img/ja-JP/02_allsongs.jpg", "03_gate": "img/ja-JP/03_gate.jpg", "04_play": "img/ja-JP/04_play.jpg", "05_playing": "img/ja-JP/05_playing.jpg", "07_export": "img/ja-JP/07_export.jpg", "01_recent": "img/ja-JP/01_recent.jpg"}, "rtl": false}, "zh-CN": {"t": {"lang_name": "简体中文", "title": "Dokebising 使用指南", "subtitle": "去掉手机歌曲中的人声，跟着伴奏一起唱。", "toc": "目录", "select_lang": "语言", "s_intro_t": "Dokebising 是什么？", "s_intro_b": "Dokebising 使用 AI 从手机里的音乐文件中分离人声，只留下伴奏。你可以看着歌词演唱、录下自己的声音，并保存为自己的翻唱作品。所有处理都在手机上完成，音频不会被上传。", "s_pick_t": "1. 选择歌曲", "s_pick_b": "在主界面顶部的 5 个标签中选择歌曲。", "tab_recent_d": "已经分离过的歌曲，无需等待即可打开。", "tab_fav_d": "点过爱心的歌曲。", "tab_all_d": "手机上的所有音乐文件。", "tab_phone_d": "直接浏览手机文件夹查找文件。", "tab_rec_d": "收听已保存的录音。", "s_start_t": "2. 开始并消除人声", "s_start_b1": "选择歌曲后点击“{start}”。", "s_start_b2": "前 3 首新歌可免广告开始。之后可点击“{watch_ad}”，或通过“{subscribe}”免广告使用。", "s_start_b3": "AI 在手机上分离人声，所需时间约等于歌曲长度，前面部分准备好后即可开始播放。", "s_play_t": "3. 播放界面", "play_b1": "点击中间的粉色按钮播放或停止。", "play_b2": "“{vocal}”：打开时可听到原唱作为引导，关闭时只有伴奏。", "play_b3": "“{show_score}”：打开后每唱一次都会显示分数。", "play_b4": "歌词会随歌曲滚动，点击铅笔按钮可编辑歌词。", "s_rec_t": "4. 演唱并录音", "s_rec_b": "点击播放时会自动开始录音。红色波形就是你的声音。再次点击按钮即可停止。", "s_score_t": "5. 查看分数", "s_score_b": "打开“{show_score}”后，录音结束时会显示分数。点击“{ok}”关闭。", "s_save_t": "6. 保存录音", "save_b1": "录音后，点击播放界面底部的下载按钮。", "save_b2": "用箭头微调人声与伴奏的同步。", "save_b3": "“{save}”：将混音后的歌曲作为音频文件保存到手机。", "save_b4": "“{save_cloud}”：保存到 Google 云端硬盘等云服务。", "save_b5": "点击标题旁的铅笔按钮可重命名。", "s_lib_t": "7. 已保存的歌曲", "s_lib_b": "分离后的歌曲会自动保存到“{recent}”标签，无需再次等待。点爱心可加入“{favorites}”标签，点垃圾桶可删除。已保存的录音可在“{recordings}”标签中收听。", "s_faq_t": "提示与常见问题", "faq1": "歌词：会显示 MP3 文件内嵌的歌词。将与歌曲同名的 .lrc 文件放在同一文件夹中，歌词就会随歌曲同步滚动。", "faq2": "屏幕关闭时分离会变慢。想要最快完成，请保持屏幕开启。", "faq3": "隐私：你的歌曲和录音只保存在手机上，不会发送到我们的服务器。", "faq4": "权限：显示歌曲列表需要音乐访问权限，录音需要麦克风权限。", "faq5": "请仅将您本人拥有的音乐用于个人练习。公开传播分离后的音频可能构成侵权。"}, "lab": {"start": "开始", "watch_ad": "观看广告后开始", "subscribe": "订阅", "vocal": "人声", "show_score": "显示分数", "save": "保存", "save_cloud": "保存到云端", "recent": "最近", "favorites": "收藏", "all_songs": "所有歌曲", "my_phone": "我的手机", "recordings": "录音列表", "ok": "确定", "privacy": "隐私政策"}, "img": {"02_allsongs": "img/zh-CN/02_allsongs.jpg", "03_gate": "img/zh-CN/03_gate.jpg", "04_play": "img/zh-CN/04_play.jpg", "05_playing": "img/zh-CN/05_playing.jpg", "07_export": "img/zh-CN/07_export.jpg", "01_recent": "img/zh-CN/01_recent.jpg"}, "rtl": false}, "zh-TW": {"t": {"lang_name": "繁體中文", "title": "Dokebising 使用說明", "subtitle": "去掉手機歌曲中的人聲，跟著伴奏一起唱。", "toc": "目錄", "select_lang": "語言", "s_intro_t": "Dokebising 是什麼？", "s_intro_b": "Dokebising 使用 AI 從手機裡的音樂檔案中分離人聲，只留下伴奏。你可以看著歌詞演唱、錄下自己的聲音，並儲存為自己的翻唱作品。所有處理都在手機上完成，音訊不會被上傳。", "s_pick_t": "1. 選擇歌曲", "s_pick_b": "在主畫面上方的 5 個分頁中選擇歌曲。", "tab_recent_d": "已經分離過的歌曲，不必等待即可開啟。", "tab_fav_d": "按過愛心的歌曲。", "tab_all_d": "手機上的所有音樂檔案。", "tab_phone_d": "直接瀏覽手機資料夾尋找檔案。", "tab_rec_d": "收聽已儲存的錄音。", "s_start_t": "2. 開始並消除人聲", "s_start_b1": "選擇歌曲後按「{start}」。", "s_start_b2": "前 3 首新歌可免廣告開始。之後可按「{watch_ad}」，或透過「{subscribe}」免廣告使用。", "s_start_b3": "AI 在手機上分離人聲，所需時間約等於歌曲長度，前面部分準備好後即可開始播放。", "s_play_t": "3. 播放畫面", "play_b1": "按中間的粉紅色按鈕播放或停止。", "play_b2": "「{vocal}」：開啟時可聽到原唱作為引導，關閉時只有伴奏。", "play_b3": "「{show_score}」：開啟後每唱一次都會顯示分數。", "play_b4": "歌詞會隨歌曲捲動，按鉛筆按鈕可編輯歌詞。", "s_rec_t": "4. 演唱並錄音", "s_rec_b": "按下播放時會自動開始錄音。紅色波形就是你的聲音。再按一次按鈕即可停止。", "s_score_t": "5. 查看分數", "s_score_b": "開啟「{show_score}」後，錄音結束時會顯示分數。按「{ok}」關閉。", "s_save_t": "6. 儲存錄音", "save_b1": "錄音後，按播放畫面下方的下載按鈕。", "save_b2": "用箭頭微調人聲與伴奏的同步。", "save_b3": "「{save}」：將混音後的歌曲以音訊檔案儲存到手機。", "save_b4": "「{save_cloud}」：儲存到 Google 雲端硬碟等雲端服務。", "save_b5": "按標題旁的鉛筆按鈕可重新命名。", "s_lib_t": "7. 已儲存的歌曲", "s_lib_b": "分離後的歌曲會自動儲存到「{recent}」分頁，不必再次等待。按愛心可加入「{favorites}」分頁，按垃圾桶可刪除。已儲存的錄音可在「{recordings}」分頁收聽。", "s_faq_t": "提示與常見問題", "faq1": "歌詞：會顯示 MP3 檔案內嵌的歌詞。將與歌曲同名的 .lrc 檔案放在同一資料夾，歌詞就會隨歌曲同步捲動。", "faq2": "螢幕關閉時分離會變慢。想要最快完成，請保持螢幕開啟。", "faq3": "隱私：你的歌曲和錄音只儲存在手機上，不會傳送到我們的伺服器。", "faq4": "權限：顯示歌曲清單需要音樂存取權限，錄音需要麥克風權限。", "faq5": "請僅將您本人擁有的音樂用於個人練習。公開散布分離後的音訊可能構成侵權。"}, "lab": {"start": "開始", "watch_ad": "觀看廣告後開始", "subscribe": "訂閱", "vocal": "人聲", "show_score": "顯示分數", "save": "儲存", "save_cloud": "儲存到雲端", "recent": "最近", "favorites": "收藏", "all_songs": "所有歌曲", "my_phone": "我的手機", "recordings": "錄音列表", "ok": "確定", "privacy": "隱私權政策"}, "img": {"02_allsongs": "img/zh-TW/02_allsongs.jpg", "03_gate": "img/zh-TW/03_gate.jpg", "04_play": "img/zh-TW/04_play.jpg", "05_playing": "img/zh-TW/05_playing.jpg", "07_export": "img/zh-TW/07_export.jpg", "01_recent": "img/zh-TW/01_recent.jpg"}, "rtl": false}, "es-ES": {"t": {"lang_name": "Español", "title": "Guía de uso de Dokebising", "subtitle": "Quita la voz de las canciones de tu móvil y canta sobre el instrumental.", "toc": "Contenido", "select_lang": "Idioma", "s_intro_t": "¿Qué es Dokebising?", "s_intro_b": "Dokebising usa IA para separar la voz de los archivos de música de tu móvil y dejar solo el instrumental. Canta con la letra, graba tu voz y guarda tu propia versión. Todo se procesa en tu móvil: tu música nunca se sube a ningún servidor.", "s_pick_t": "1. Elige una canción", "s_pick_b": "Elige una canción en una de las cinco pestañas de la parte superior de la pantalla principal.", "tab_recent_d": "Canciones que ya separaste. Se abren al instante.", "tab_fav_d": "Canciones marcadas con el corazón.", "tab_all_d": "Todos los archivos de música de tu móvil.", "tab_phone_d": "Explora las carpetas del móvil para buscar un archivo.", "tab_rec_d": "Escucha las grabaciones que guardaste.", "s_start_t": "2. Empieza y quita la voz", "s_start_b1": "Selecciona una canción y pulsa «{start}».", "s_start_b2": "Tus 3 primeras canciones nuevas empiezan sin anuncios. Después, elige «{watch_ad}» o «{subscribe}» para usarla sin anuncios.", "s_start_b3": "La IA quita la voz en tu móvil. Tarda más o menos lo que dura la canción y puedes empezar a reproducir en cuanto esté lista la primera parte.", "s_play_t": "3. Pantalla de reproducción", "play_b1": "Pulsa el botón rosa grande para reproducir o detener.", "play_b2": "«{vocal}»: actívalo para oír la voz original como guía; desactívalo para cantar solo con el instrumental.", "play_b3": "«{show_score}»: si está activado, recibes una puntuación después de cada toma.", "play_b4": "La letra avanza con la canción. Toca el lápiz para editarla.", "s_rec_t": "4. Canta y graba", "s_rec_b": "La grabación empieza automáticamente al pulsar reproducir. La onda roja es tu voz. Pulsa el botón otra vez para detener.", "s_score_t": "5. Consulta tu puntuación", "s_score_b": "Con «{show_score}» activado, al terminar una toma aparece tu puntuación. Pulsa «{ok}» para cerrarla.", "s_save_t": "6. Guarda tu grabación", "save_b1": "Después de grabar, toca el botón de descarga en la parte inferior de la pantalla.", "save_b2": "Usa las flechas para ajustar la sincronización entre tu voz y el instrumental.", "save_b3": "«{save}»: guarda la mezcla como archivo de audio en tu móvil.", "save_b4": "«{save_cloud}»: la guarda en un servicio en la nube como Google Drive.", "save_b5": "Toca el lápiz junto al título para cambiarle el nombre.", "s_lib_t": "7. Tus canciones guardadas", "s_lib_b": "Las canciones separadas se guardan automáticamente en la pestaña «{recent}», así que nunca esperas dos veces. Toca el corazón para añadirla a «{favorites}» o la papelera para borrarla. Las grabaciones guardadas se escuchan en «{recordings}».", "s_faq_t": "Consejos y preguntas frecuentes", "faq1": "Letras: se muestra la letra incluida en el archivo MP3. Para letras sincronizadas, coloca un archivo .lrc con el mismo nombre junto a la canción.", "faq2": "Con la pantalla apagada el proceso es más lento. Mantén la pantalla encendida para que vaya más rápido.", "faq3": "Privacidad: tus canciones y grabaciones se quedan en tu móvil y nunca se envían a nuestros servidores.", "faq4": "Permisos: la app necesita acceso a tu música para mostrar las canciones y al micrófono para grabar.", "faq5": "Usa música de tu propiedad y solo para práctica personal. Compartir públicamente las pistas separadas puede infringir derechos de autor."}, "lab": {"start": "Empezar", "watch_ad": "Ver anuncio para empezar", "subscribe": "Suscribirse", "vocal": "Voz", "show_score": "Mostrar puntuación", "save": "Guardar", "save_cloud": "Guardar en la nube", "recent": "Reciente", "favorites": "Favoritos", "all_songs": "Todas las canciones", "my_phone": "Mi teléfono", "recordings": "Grabaciones", "ok": "Aceptar", "privacy": "Política de privacidad"}, "img": {"02_allsongs": "img/es-ES/02_allsongs.jpg", "03_gate": "img/es-ES/03_gate.jpg", "04_play": "img/es-ES/04_play.jpg", "05_playing": "img/es-ES/05_playing.jpg", "07_export": "img/es-ES/07_export.jpg", "01_recent": "img/es-ES/01_recent.jpg"}, "rtl": false}, "pt-BR": {"t": {"lang_name": "Português (Brasil)", "title": "Guia do Dokebising", "subtitle": "Remova a voz das músicas do seu celular e cante com o instrumental.", "toc": "Conteúdo", "select_lang": "Idioma", "s_intro_t": "O que é o Dokebising?", "s_intro_b": "O Dokebising usa IA para separar a voz dos arquivos de música do seu celular, deixando só o instrumental. Cante acompanhando a letra, grave sua voz e salve sua própria versão. Tudo é processado no celular — sua música nunca é enviada para um servidor.", "s_pick_t": "1. Escolha uma música", "s_pick_b": "Escolha uma música em uma das cinco abas no topo da tela principal.", "tab_recent_d": "Músicas que você já separou. Abrem na hora.", "tab_fav_d": "Músicas marcadas com o coração.", "tab_all_d": "Todos os arquivos de música do celular.", "tab_phone_d": "Navegue pelas pastas do celular para encontrar um arquivo.", "tab_rec_d": "Ouça as gravações que você salvou.", "s_start_t": "2. Comece e remova a voz", "s_start_b1": "Selecione uma música e toque em \"{start}\".", "s_start_b2": "As 3 primeiras músicas novas começam sem anúncios. Depois disso, escolha \"{watch_ad}\" ou \"{subscribe}\" para usar sem anúncios.", "s_start_b3": "A IA remove a voz no próprio celular. Leva mais ou menos o tempo da música, e você já pode tocar assim que a primeira parte estiver pronta.", "s_play_t": "3. Tela de reprodução", "play_b1": "Toque no botão rosa grande para tocar ou parar.", "play_b2": "\"{vocal}\": ligado, você ouve a voz original como guia; desligado, só o instrumental.", "play_b3": "\"{show_score}\": ligado, você recebe uma nota a cada tentativa.", "play_b4": "A letra acompanha a música. Toque no lápis para editá-la.", "s_rec_t": "4. Cante e grave", "s_rec_b": "A gravação começa automaticamente ao tocar a música. A onda vermelha é a sua voz. Toque no botão de novo para parar.", "s_score_t": "5. Veja sua nota", "s_score_b": "Com \"{show_score}\" ligado, a nota aparece ao fim de cada tentativa. Toque em \"{ok}\" para fechar.", "s_save_t": "6. Salve sua gravação", "save_b1": "Depois de gravar, toque no botão de download na parte de baixo da tela.", "save_b2": "Use as setas para ajustar a sincronia entre a sua voz e o instrumental.", "save_b3": "\"{save}\": salva a mixagem como arquivo de áudio no celular.", "save_b4": "\"{save_cloud}\": salva em um serviço de nuvem, como o Google Drive.", "save_b5": "Toque no lápis ao lado do título para renomear.", "s_lib_t": "7. Suas músicas salvas", "s_lib_b": "As músicas separadas são salvas automaticamente na aba \"{recent}\", então você nunca espera duas vezes. Toque no coração para adicionar a \"{favorites}\" ou na lixeira para excluir. As gravações salvas ficam na aba \"{recordings}\".", "s_faq_t": "Dicas e perguntas frequentes", "faq1": "Letras: a letra incluída no arquivo MP3 é exibida. Para letras sincronizadas, coloque um arquivo .lrc com o mesmo nome ao lado da música.", "faq2": "Com a tela desligada o processamento fica mais lento. Mantenha a tela ligada para terminar mais rápido.", "faq3": "Privacidade: suas músicas e gravações ficam no celular e nunca são enviadas aos nossos servidores.", "faq4": "Permissões: o app precisa de acesso às suas músicas para listá-las e ao microfone para gravar.", "faq5": "Use músicas que sejam suas, apenas para prática pessoal. Distribuir publicamente as faixas separadas pode violar direitos autorais."}, "lab": {"start": "Iniciar", "watch_ad": "Assistir anúncio para começar", "subscribe": "Assinar", "vocal": "Vocal", "show_score": "Mostrar pontuação", "save": "Salvar", "save_cloud": "Salvar na nuvem", "recent": "Recentes", "favorites": "Favoritos", "all_songs": "Todas as músicas", "my_phone": "Do meu telefone", "recordings": "Gravações", "ok": "OK", "privacy": "Política de Privacidade"}, "img": {"02_allsongs": "img/pt-BR/02_allsongs.jpg", "03_gate": "img/pt-BR/03_gate.jpg", "04_play": "img/pt-BR/04_play.jpg", "05_playing": "img/pt-BR/05_playing.jpg", "07_export": "img/pt-BR/07_export.jpg", "01_recent": "img/pt-BR/01_recent.jpg"}, "rtl": false}, "pt-PT": {"t": {"lang_name": "Português (Portugal)", "title": "Guia do Dokebising", "subtitle": "Remova a voz das músicas do seu telemóvel e cante com o instrumental.", "toc": "Índice", "select_lang": "Idioma", "s_intro_t": "O que é o Dokebising?", "s_intro_b": "O Dokebising utiliza IA para separar a voz dos ficheiros de música do seu telemóvel, deixando apenas o instrumental. Cante a acompanhar a letra, grave a sua voz e guarde a sua própria versão. Tudo é processado no telemóvel — a sua música nunca é enviada para um servidor.", "s_pick_t": "1. Escolha uma música", "s_pick_b": "Escolha uma música num dos cinco separadores no topo do ecrã principal.", "tab_recent_d": "Músicas que já separou. Abrem de imediato.", "tab_fav_d": "Músicas marcadas com o coração.", "tab_all_d": "Todos os ficheiros de música do telemóvel.", "tab_phone_d": "Explore as pastas do telemóvel para encontrar um ficheiro.", "tab_rec_d": "Ouça as gravações que guardou.", "s_start_t": "2. Comece e remova a voz", "s_start_b1": "Selecione uma música e toque em \"{start}\".", "s_start_b2": "As primeiras 3 músicas novas começam sem anúncios. Depois disso, escolha \"{watch_ad}\" ou \"{subscribe}\" para utilizar sem anúncios.", "s_start_b3": "A IA remove a voz no próprio telemóvel. Demora mais ou menos o tempo da música e pode começar a reproduzir assim que a primeira parte estiver pronta.", "s_play_t": "3. Ecrã de reprodução", "play_b1": "Toque no botão cor-de-rosa grande para reproduzir ou parar.", "play_b2": "\"{vocal}\": ligado, ouve a voz original como guia; desligado, apenas o instrumental.", "play_b3": "\"{show_score}\": ligado, recebe uma pontuação em cada tentativa.", "play_b4": "A letra acompanha a música. Toque no lápis para a editar.", "s_rec_t": "4. Cante e grave", "s_rec_b": "A gravação começa automaticamente quando toca em reproduzir. A onda vermelha é a sua voz. Toque novamente no botão para parar.", "s_score_t": "5. Veja a sua pontuação", "s_score_b": "Com \"{show_score}\" ligado, a pontuação aparece no fim de cada tentativa. Toque em \"{ok}\" para fechar.", "s_save_t": "6. Guarde a sua gravação", "save_b1": "Depois de gravar, toque no botão de transferência na parte inferior do ecrã.", "save_b2": "Utilize as setas para ajustar a sincronização entre a sua voz e o instrumental.", "save_b3": "\"{save}\": guarda a mistura como ficheiro de áudio no telemóvel.", "save_b4": "\"{save_cloud}\": guarda num serviço na nuvem, como o Google Drive.", "save_b5": "Toque no lápis junto ao título para mudar o nome.", "s_lib_t": "7. As suas músicas guardadas", "s_lib_b": "As músicas separadas ficam guardadas automaticamente no separador \"{recent}\", por isso nunca tem de esperar duas vezes. Toque no coração para adicionar a \"{favorites}\" ou no caixote do lixo para eliminar. As gravações guardadas estão no separador \"{recordings}\".", "s_faq_t": "Dicas e perguntas frequentes", "faq1": "Letras: é apresentada a letra incluída no ficheiro MP3. Para letras sincronizadas, coloque um ficheiro .lrc com o mesmo nome junto à música.", "faq2": "Com o ecrã desligado o processamento é mais lento. Mantenha o ecrã ligado para terminar mais depressa.", "faq3": "Privacidade: as suas músicas e gravações ficam no telemóvel e nunca são enviadas para os nossos servidores.", "faq4": "Permissões: a aplicação precisa de acesso à sua música para a listar e ao microfone para gravar.", "faq5": "Utilize apenas músicas que lhe pertençam e para prática pessoal. Distribuir publicamente as faixas separadas pode violar os direitos de autor."}, "lab": {"start": "Iniciar", "watch_ad": "Assistir anúncio para começar", "subscribe": "Assinar", "vocal": "Vocal", "show_score": "Mostrar pontuação", "save": "Salvar", "save_cloud": "Salvar na nuvem", "recent": "Recentes", "favorites": "Favoritos", "all_songs": "Todas as músicas", "my_phone": "Do meu telefone", "recordings": "Gravações", "ok": "OK", "privacy": "Política de Privacidade"}, "img": {"02_allsongs": "img/pt-BR/02_allsongs.jpg", "03_gate": "img/pt-BR/03_gate.jpg", "04_play": "img/pt-BR/04_play.jpg", "05_playing": "img/pt-BR/05_playing.jpg", "07_export": "img/pt-BR/07_export.jpg", "01_recent": "img/pt-BR/01_recent.jpg"}, "rtl": false}, "fr-FR": {"t": {"lang_name": "Français", "title": "Guide d'utilisation de Dokebising", "subtitle": "Retirez la voix des chansons de votre téléphone et chantez sur l'instrumental.", "toc": "Sommaire", "select_lang": "Langue", "s_intro_t": "Qu'est-ce que Dokebising ?", "s_intro_b": "Dokebising utilise l'IA pour séparer la voix des fichiers musicaux de votre téléphone et ne garder que l'instrumental. Chantez avec les paroles, enregistrez votre voix et sauvegardez votre propre reprise. Tout est traité sur votre téléphone : votre musique n'est jamais envoyée sur un serveur.", "s_pick_t": "1. Choisissez une chanson", "s_pick_b": "Choisissez une chanson dans l'un des cinq onglets en haut de l'écran principal.", "tab_recent_d": "Les chansons déjà séparées. Elles s'ouvrent instantanément.", "tab_fav_d": "Les chansons marquées d'un cœur.", "tab_all_d": "Tous les fichiers musicaux de votre téléphone.", "tab_phone_d": "Parcourez les dossiers du téléphone pour trouver un fichier.", "tab_rec_d": "Écoutez les enregistrements sauvegardés.", "s_start_t": "2. Lancez et retirez la voix", "s_start_b1": "Sélectionnez une chanson et appuyez sur « {start} ».", "s_start_b2": "Vos 3 premières nouvelles chansons démarrent sans publicité. Ensuite, choisissez « {watch_ad} » ou « {subscribe} » pour une utilisation sans publicité.", "s_start_b3": "L'IA retire la voix directement sur votre téléphone. Cela prend environ la durée de la chanson, et vous pouvez commencer la lecture dès que le début est prêt.", "s_play_t": "3. L'écran de lecture", "play_b1": "Appuyez sur le gros bouton rose pour lire ou arrêter.", "play_b2": "« {vocal} » : activé, vous entendez la voix originale comme guide ; désactivé, seulement l'instrumental.", "play_b3": "« {show_score} » : activé, vous obtenez une note après chaque prise.", "play_b4": "Les paroles défilent avec la chanson. Touchez le crayon pour les modifier.", "s_rec_t": "4. Chantez et enregistrez", "s_rec_b": "L'enregistrement démarre automatiquement quand vous lancez la lecture. La forme d'onde rouge, c'est votre voix. Appuyez à nouveau sur le bouton pour arrêter.", "s_score_t": "5. Consultez votre note", "s_score_b": "Avec « {show_score} » activé, la note s'affiche à la fin de chaque prise. Appuyez sur « {ok} » pour fermer.", "s_save_t": "6. Sauvegardez votre enregistrement", "save_b1": "Après l'enregistrement, touchez le bouton de téléchargement en bas de l'écran de lecture.", "save_b2": "Utilisez les flèches pour ajuster la synchronisation entre votre voix et l'instrumental.", "save_b3": "« {save} » : enregistre le mixage comme fichier audio sur votre téléphone.", "save_b4": "« {save_cloud} » : l'enregistre dans un service cloud comme Google Drive.", "save_b5": "Touchez le crayon à côté du titre pour le renommer.", "s_lib_t": "7. Vos chansons sauvegardées", "s_lib_b": "Les chansons séparées sont enregistrées automatiquement dans l'onglet « {recent} » : plus besoin d'attendre une deuxième fois. Touchez le cœur pour l'ajouter à « {favorites} » ou la corbeille pour la supprimer. Les enregistrements sauvegardés s'écoutent dans « {recordings} ».", "s_faq_t": "Conseils et FAQ", "faq1": "Paroles : les paroles intégrées au fichier MP3 sont affichées. Pour des paroles synchronisées, placez un fichier .lrc portant le même nom à côté de la chanson.", "faq2": "Le traitement est plus lent écran éteint. Laissez l'écran allumé pour aller plus vite.", "faq3": "Confidentialité : vos chansons et enregistrements restent sur votre téléphone et ne sont jamais envoyés à nos serveurs.", "faq4": "Autorisations : l'application a besoin d'accéder à votre musique pour afficher les chansons et au micro pour enregistrer.", "faq5": "Utilisez de la musique qui vous appartient, pour un usage personnel uniquement. Diffuser publiquement les pistes séparées peut enfreindre le droit d'auteur."}, "lab": {"start": "Démarrer", "watch_ad": "Regarder la pub pour commencer", "subscribe": "S\\'abonner", "vocal": "Voix", "show_score": "Afficher le score", "save": "Enregistrer", "save_cloud": "Enregistrer dans le cloud", "recent": "Récents", "favorites": "Favoris", "all_songs": "Toutes les chansons", "my_phone": "Mon téléphone", "recordings": "Enregistrements", "ok": "OK", "privacy": "Politique de confidentialité"}, "img": {"02_allsongs": "img/fr-FR/02_allsongs.jpg", "03_gate": "img/fr-FR/03_gate.jpg", "04_play": "img/fr-FR/04_play.jpg", "05_playing": "img/fr-FR/05_playing.jpg", "07_export": "img/fr-FR/07_export.jpg", "01_recent": "img/fr-FR/01_recent.jpg"}, "rtl": false}, "de-DE": {"t": {"lang_name": "Deutsch", "title": "Dokebising Anleitung", "subtitle": "Entferne den Gesang aus Songs auf deinem Handy und sing zur Begleitung.", "toc": "Inhalt", "select_lang": "Sprache", "s_intro_t": "Was ist Dokebising?", "s_intro_b": "Dokebising trennt mit KI den Gesang von Musikdateien auf deinem Handy und lässt nur das Instrumental übrig. Sing mit dem Songtext, nimm deine Stimme auf und speichere dein eigenes Cover. Alles wird auf dem Handy verarbeitet – deine Musik wird nie hochgeladen.", "s_pick_t": "1. Song auswählen", "s_pick_b": "Wähle einen Song in einem der fünf Tabs oben auf dem Hauptbildschirm.", "tab_recent_d": "Bereits getrennte Songs. Sie öffnen sich sofort.", "tab_fav_d": "Songs, die du mit dem Herz markiert hast.", "tab_all_d": "Alle Musikdateien auf deinem Handy.", "tab_phone_d": "Durchsuche die Ordner deines Handys nach einer Datei.", "tab_rec_d": "Hör dir deine gespeicherten Aufnahmen an.", "s_start_t": "2. Starten und Gesang entfernen", "s_start_b1": "Wähle einen Song und tippe auf „{start}“.", "s_start_b2": "Deine ersten 3 neuen Songs startest du ohne Werbung. Danach wählst du „{watch_ad}“ oder „{subscribe}“ für die werbefreie Nutzung.", "s_start_b3": "Die KI entfernt den Gesang direkt auf dem Handy. Das dauert etwa so lange wie der Song, und du kannst abspielen, sobald der erste Teil fertig ist.", "s_play_t": "3. Wiedergabebildschirm", "play_b1": "Mit dem großen rosa Knopf startest oder stoppst du die Wiedergabe.", "play_b2": "„{vocal}“: an = Originalstimme als Orientierung, aus = nur Begleitung.", "play_b3": "„{show_score}“: wenn aktiviert, bekommst du nach jedem Durchgang Punkte.", "play_b4": "Der Songtext läuft mit. Tippe auf den Stift, um ihn zu bearbeiten.", "s_rec_t": "4. Singen und aufnehmen", "s_rec_b": "Die Aufnahme startet automatisch mit der Wiedergabe. Die rote Wellenform ist deine Stimme. Tippe erneut auf den Knopf, um zu stoppen.", "s_score_t": "5. Punktzahl ansehen", "s_score_b": "Ist „{show_score}“ aktiviert, erscheint am Ende jedes Durchgangs deine Punktzahl. Mit „{ok}“ schließt du sie.", "s_save_t": "6. Aufnahme speichern", "save_b1": "Tippe nach der Aufnahme unten auf dem Wiedergabebildschirm auf den Download-Knopf.", "save_b2": "Mit den Pfeilen stimmst du deine Stimme und die Begleitung fein aufeinander ab.", "save_b3": "„{save}“: speichert den Mix als Audiodatei auf dem Handy.", "save_b4": "„{save_cloud}“: speichert ihn in einem Cloud-Dienst wie Google Drive.", "save_b5": "Tippe auf den Stift neben dem Titel, um ihn umzubenennen.", "s_lib_t": "7. Gespeicherte Songs", "s_lib_b": "Getrennte Songs werden automatisch im Tab „{recent}“ gespeichert, du wartest also nie zweimal. Mit dem Herz fügst du sie zu „{favorites}“ hinzu, mit dem Papierkorb löschst du sie. Gespeicherte Aufnahmen findest du unter „{recordings}“.", "s_faq_t": "Tipps & FAQ", "faq1": "Songtexte: In der MP3-Datei enthaltene Texte werden angezeigt. Für synchronisierte Texte lege eine .lrc-Datei mit demselben Namen neben den Song.", "faq2": "Bei ausgeschaltetem Bildschirm dauert die Verarbeitung länger. Lass den Bildschirm an, um am schnellsten fertig zu werden.", "faq3": "Datenschutz: Deine Songs und Aufnahmen bleiben auf deinem Handy und werden nie an unsere Server gesendet.", "faq4": "Berechtigungen: Die App braucht Zugriff auf deine Musik, um Songs anzuzeigen, und auf das Mikrofon, um aufzunehmen.", "faq5": "Verwende nur Musik, die dir gehört, und nur zum privaten Üben. Die öffentliche Verbreitung getrennter Tracks kann Urheberrechte verletzen."}, "lab": {"start": "Start", "watch_ad": "Werbung ansehen und starten", "subscribe": "Abonnieren", "vocal": "Gesang", "show_score": "Bewertung anzeigen", "save": "Speichern", "save_cloud": "In der Cloud speichern", "recent": "Zuletzt verwendet", "favorites": "Favoriten", "all_songs": "Alle Songs", "my_phone": "Mein Telefon", "recordings": "Aufnahmen", "ok": "OK", "privacy": "Datenschutzerklärung"}, "img": {"02_allsongs": "img/de-DE/02_allsongs.jpg", "03_gate": "img/de-DE/03_gate.jpg", "04_play": "img/de-DE/04_play.jpg", "05_playing": "img/de-DE/05_playing.jpg", "07_export": "img/de-DE/07_export.jpg", "01_recent": "img/de-DE/01_recent.jpg"}, "rtl": false}, "it-IT": {"t": {"lang_name": "Italiano", "title": "Guida di Dokebising", "subtitle": "Togli la voce dalle canzoni del tuo telefono e canta sulla base.", "toc": "Indice", "select_lang": "Lingua", "s_intro_t": "Cos'è Dokebising?", "s_intro_b": "Dokebising usa l'IA per separare la voce dai file musicali del tuo telefono, lasciando solo la base. Canta seguendo il testo, registra la tua voce e salva la tua cover. Tutto viene elaborato sul telefono: la tua musica non viene mai caricata.", "s_pick_t": "1. Scegli una canzone", "s_pick_b": "Scegli una canzone in una delle cinque schede in alto nella schermata principale.", "tab_recent_d": "Canzoni già separate. Si aprono subito.", "tab_fav_d": "Canzoni contrassegnate con il cuore.", "tab_all_d": "Tutti i file musicali del telefono.", "tab_phone_d": "Sfoglia le cartelle del telefono per trovare un file.", "tab_rec_d": "Ascolta le registrazioni salvate.", "s_start_t": "2. Avvia e togli la voce", "s_start_b1": "Seleziona una canzone e premi «{start}».", "s_start_b2": "Le prime 3 nuove canzoni partono senza pubblicità. Dopo, scegli «{watch_ad}» oppure «{subscribe}» per usarla senza pubblicità.", "s_start_b3": "L'IA toglie la voce direttamente sul telefono. Ci vuole più o meno la durata della canzone, e puoi iniziare ad ascoltare appena è pronta la prima parte.", "s_play_t": "3. Schermata di riproduzione", "play_b1": "Premi il grande pulsante rosa per riprodurre o fermare.", "play_b2": "«{vocal}»: attivo per sentire la voce originale come guida, disattivo per cantare solo sulla base.", "play_b3": "«{show_score}»: se attivo, ricevi un punteggio dopo ogni prova.", "play_b4": "Il testo scorre con la canzone. Tocca la matita per modificarlo.", "s_rec_t": "4. Canta e registra", "s_rec_b": "La registrazione parte automaticamente quando premi play. L'onda rossa è la tua voce. Premi di nuovo il pulsante per fermare.", "s_score_t": "5. Guarda il punteggio", "s_score_b": "Con «{show_score}» attivo, alla fine di ogni prova appare il punteggio. Premi «{ok}» per chiuderlo.", "s_save_t": "6. Salva la registrazione", "save_b1": "Dopo aver registrato, tocca il pulsante di download in basso nella schermata di riproduzione.", "save_b2": "Usa le frecce per regolare la sincronizzazione tra voce e base.", "save_b3": "«{save}»: salva il mix come file audio sul telefono.", "save_b4": "«{save_cloud}»: lo salva su un servizio cloud come Google Drive.", "save_b5": "Tocca la matita accanto al titolo per rinominarlo.", "s_lib_t": "7. Le canzoni salvate", "s_lib_b": "Le canzoni separate vengono salvate automaticamente nella scheda «{recent}», così non aspetti mai due volte. Tocca il cuore per aggiungerle a «{favorites}» o il cestino per eliminarle. Le registrazioni salvate si ascoltano in «{recordings}».", "s_faq_t": "Suggerimenti e domande frequenti", "faq1": "Testi: viene mostrato il testo incluso nel file MP3. Per testi sincronizzati, metti un file .lrc con lo stesso nome accanto alla canzone.", "faq2": "A schermo spento l'elaborazione è più lenta. Tieni lo schermo acceso per finire prima.", "faq3": "Privacy: canzoni e registrazioni restano sul telefono e non vengono mai inviate ai nostri server.", "faq4": "Autorizzazioni: l'app ha bisogno di accedere alla tua musica per mostrare i brani e al microfono per registrare.", "faq5": "Usa musica di tua proprietà e solo per esercizio personale. Diffondere pubblicamente le tracce separate può violare il diritto d'autore."}, "lab": {"start": "Avvia", "watch_ad": "Guarda un annuncio per iniziare", "subscribe": "Abbonati", "vocal": "Voce", "show_score": "Mostra punteggio", "save": "Salva", "save_cloud": "Salva nel cloud", "recent": "Recenti", "favorites": "Preferiti", "all_songs": "Tutti i brani", "my_phone": "Il mio telefono", "recordings": "Registrazioni", "ok": "OK", "privacy": "Informativa sulla privacy"}, "img": {"02_allsongs": "img/it-IT/02_allsongs.jpg", "03_gate": "img/it-IT/03_gate.jpg", "04_play": "img/it-IT/04_play.jpg", "05_playing": "img/it-IT/05_playing.jpg", "07_export": "img/it-IT/07_export.jpg", "01_recent": "img/it-IT/01_recent.jpg"}, "rtl": false}, "nl-NL": {"t": {"lang_name": "Nederlands", "title": "Handleiding Dokebising", "subtitle": "Haal de zang uit nummers op je telefoon en zing mee op de begeleiding.", "toc": "Inhoud", "select_lang": "Taal", "s_intro_t": "Wat is Dokebising?", "s_intro_b": "Dokebising gebruikt AI om de zang uit muziekbestanden op je telefoon te halen, zodat alleen de instrumentale versie overblijft. Zing mee met de tekst, neem je stem op en sla je eigen cover op. Alles wordt op je telefoon verwerkt – je muziek wordt nooit geüpload.", "s_pick_t": "1. Kies een nummer", "s_pick_b": "Kies een nummer in een van de vijf tabbladen bovenaan het hoofdscherm.", "tab_recent_d": "Nummers die je al hebt gescheiden. Ze openen meteen.", "tab_fav_d": "Nummers die je met het hartje hebt gemarkeerd.", "tab_all_d": "Alle muziekbestanden op je telefoon.", "tab_phone_d": "Blader door de mappen van je telefoon om een bestand te vinden.", "tab_rec_d": "Beluister je opgeslagen opnames.", "s_start_t": "2. Start en verwijder de zang", "s_start_b1": "Selecteer een nummer en tik op ‘{start}’.", "s_start_b2": "Je eerste 3 nieuwe nummers start je zonder advertenties. Daarna kies je ‘{watch_ad}’ of ‘{subscribe}’ voor gebruik zonder advertenties.", "s_start_b3": "De AI verwijdert de zang op je telefoon zelf. Dat duurt ongeveer even lang als het nummer, en je kunt al afspelen zodra het eerste deel klaar is.", "s_play_t": "3. Afspeelscherm", "play_b1": "Tik op de grote roze knop om af te spelen of te stoppen.", "play_b2": "‘{vocal}’: aan voor de originele stem als gids, uit om alleen op de begeleiding te zingen.", "play_b3": "‘{show_score}’: als dit aan staat, krijg je na elke opname een score.", "play_b4": "De tekst loopt mee met het nummer. Tik op het potlood om hem te bewerken.", "s_rec_t": "4. Zingen en opnemen", "s_rec_b": "De opname start automatisch als je op afspelen tikt. De rode golfvorm is je stem. Tik nogmaals op de knop om te stoppen.", "s_score_t": "5. Bekijk je score", "s_score_b": "Met ‘{show_score}’ aan verschijnt aan het eind van elke opname je score. Tik op ‘{ok}’ om te sluiten.", "s_save_t": "6. Opname opslaan", "save_b1": "Tik na het opnemen op de downloadknop onderaan het afspeelscherm.", "save_b2": "Gebruik de pijlen om je stem en de begeleiding precies gelijk te zetten.", "save_b3": "‘{save}’: slaat de mix op als audiobestand op je telefoon.", "save_b4": "‘{save_cloud}’: slaat hem op in een clouddienst zoals Google Drive.", "save_b5": "Tik op het potlood naast de titel om de naam te wijzigen.", "s_lib_t": "7. Je opgeslagen nummers", "s_lib_b": "Gescheiden nummers worden automatisch opgeslagen in het tabblad ‘{recent}’, dus je hoeft nooit twee keer te wachten. Tik op het hartje om een nummer aan ‘{favorites}’ toe te voegen of op de prullenbak om het te verwijderen. Opgeslagen opnames beluister je in ‘{recordings}’.", "s_faq_t": "Tips & veelgestelde vragen", "faq1": "Songtekst: de tekst in het MP3-bestand wordt getoond. Voor gesynchroniseerde tekst zet je een .lrc-bestand met dezelfde naam naast het nummer.", "faq2": "Met het scherm uit gaat het verwerken langzamer. Laat het scherm aan voor het snelste resultaat.", "faq3": "Privacy: je nummers en opnames blijven op je telefoon en worden nooit naar onze servers gestuurd.", "faq4": "Rechten: de app heeft toegang tot je muziek nodig om nummers te tonen en tot de microfoon om op te nemen.", "faq5": "Gebruik alleen muziek die van jou is, om zelf te oefenen. Gescheiden tracks openbaar verspreiden kan auteursrecht schenden."}, "lab": {"start": "Start", "watch_ad": "Advertentie bekijken en starten", "subscribe": "Abonneren", "vocal": "Zang", "show_score": "Score tonen", "save": "Opslaan", "save_cloud": "Opslaan in de cloud", "recent": "Recent", "favorites": "Favorieten", "all_songs": "Alle nummers", "my_phone": "Mijn telefoon", "recordings": "Opnamen", "ok": "OK", "privacy": "Privacybeleid"}, "img": {"02_allsongs": "img/nl-NL/02_allsongs.jpg", "03_gate": "img/nl-NL/03_gate.jpg", "04_play": "img/nl-NL/04_play.jpg", "05_playing": "img/nl-NL/05_playing.jpg", "07_export": "img/nl-NL/07_export.jpg", "01_recent": "img/nl-NL/01_recent.jpg"}, "rtl": false}, "ru-RU": {"t": {"lang_name": "Русский", "title": "Руководство Dokebising", "subtitle": "Уберите голос из песен на телефоне и пойте под минусовку.", "toc": "Содержание", "select_lang": "Язык", "s_intro_t": "Что такое Dokebising?", "s_intro_b": "Dokebising с помощью ИИ отделяет вокал от музыкальных файлов на вашем телефоне и оставляет только инструментал. Пойте по тексту, записывайте свой голос и сохраняйте собственный кавер. Всё обрабатывается на телефоне — ваша музыка никогда не загружается на сервер.", "s_pick_t": "1. Выберите песню", "s_pick_b": "Выберите песню на одной из пяти вкладок вверху главного экрана.", "tab_recent_d": "Уже разделённые песни. Открываются сразу.", "tab_fav_d": "Песни, отмеченные сердечком.", "tab_all_d": "Все музыкальные файлы на телефоне.", "tab_phone_d": "Просматривайте папки телефона, чтобы найти файл.", "tab_rec_d": "Слушайте сохранённые записи.", "s_start_t": "2. Запуск и удаление вокала", "s_start_b1": "Выберите песню и нажмите «{start}».", "s_start_b2": "Первые 3 новые песни запускаются без рекламы. Затем выберите «{watch_ad}» или «{subscribe}», чтобы пользоваться без рекламы.", "s_start_b3": "ИИ удаляет вокал прямо на телефоне. Это занимает примерно столько же, сколько длится песня, а слушать можно, как только будет готово начало.", "s_play_t": "3. Экран воспроизведения", "play_b1": "Большая розовая кнопка запускает и останавливает воспроизведение.", "play_b2": "«{vocal}»: включите, чтобы слышать оригинальный голос как подсказку; выключите, чтобы петь только под минус.", "play_b3": "«{show_score}»: если включено, после каждого дубля вы получаете оценку.", "play_b4": "Текст прокручивается вместе с песней. Нажмите на карандаш, чтобы его изменить.", "s_rec_t": "4. Пойте и записывайте", "s_rec_b": "Запись начинается автоматически при воспроизведении. Красная волна — это ваш голос. Нажмите кнопку ещё раз, чтобы остановить.", "s_score_t": "5. Узнайте оценку", "s_score_b": "Если включено «{show_score}», в конце дубля появится оценка. Нажмите «{ok}», чтобы закрыть.", "s_save_t": "6. Сохраните запись", "save_b1": "После записи нажмите кнопку загрузки внизу экрана воспроизведения.", "save_b2": "Стрелками подстройте синхронизацию голоса и минусовки.", "save_b3": "«{save}»: сохраняет микс как аудиофайл на телефоне.", "save_b4": "«{save_cloud}»: сохраняет его в облако, например в Google Диск.", "save_b5": "Нажмите на карандаш рядом с названием, чтобы переименовать.", "s_lib_t": "7. Сохранённые песни", "s_lib_b": "Разделённые песни автоматически сохраняются на вкладке «{recent}», поэтому ждать второй раз не придётся. Сердечко добавляет песню в «{favorites}», корзина удаляет её. Сохранённые записи можно послушать на вкладке «{recordings}».", "s_faq_t": "Советы и вопросы", "faq1": "Тексты: показывается текст, встроенный в MP3-файл. Для синхронного текста положите рядом с песней .lrc-файл с тем же именем.", "faq2": "При выключенном экране обработка идёт медленнее. Держите экран включённым, чтобы всё было быстрее.", "faq3": "Конфиденциальность: ваши песни и записи остаются на телефоне и никогда не отправляются на наши серверы.", "faq4": "Разрешения: приложению нужен доступ к музыке, чтобы показать песни, и к микрофону, чтобы записывать.", "faq5": "Используйте только принадлежащую вам музыку и только для личных занятий. Публичное распространение разделённых треков может нарушать авторские права."}, "lab": {"start": "Начать", "watch_ad": "Посмотреть рекламу и начать", "subscribe": "Подписаться", "vocal": "Вокал", "show_score": "Показать баллы", "save": "Сохранить", "save_cloud": "Сохранить в облако", "recent": "Недавние", "favorites": "Избранное", "all_songs": "Все песни", "my_phone": "С телефона", "recordings": "Записи", "ok": "ОК", "privacy": "Политика конфиденциальности"}, "img": {"02_allsongs": "img/ru-RU/02_allsongs.jpg", "03_gate": "img/ru-RU/03_gate.jpg", "04_play": "img/ru-RU/04_play.jpg", "05_playing": "img/ru-RU/05_playing.jpg", "07_export": "img/ru-RU/07_export.jpg", "01_recent": "img/ru-RU/01_recent.jpg"}, "rtl": false}, "id": {"t": {"lang_name": "Bahasa Indonesia", "title": "Panduan Dokebising", "subtitle": "Hapus vokal dari lagu di HP-mu dan bernyanyi dengan musik pengiringnya.", "toc": "Daftar isi", "select_lang": "Bahasa", "s_intro_t": "Apa itu Dokebising?", "s_intro_b": "Dokebising memakai AI untuk memisahkan vokal dari file musik di HP-mu, sehingga hanya tersisa instrumental. Bernyanyi sambil lihat lirik, rekam suaramu, dan simpan cover versimu sendiri. Semuanya diproses di HP — musikmu tidak pernah diunggah.", "s_pick_t": "1. Pilih lagu", "s_pick_b": "Pilih lagu di salah satu dari lima tab di bagian atas layar utama.", "tab_recent_d": "Lagu yang sudah dipisahkan. Langsung terbuka.", "tab_fav_d": "Lagu yang kamu tandai dengan hati.", "tab_all_d": "Semua file musik di HP-mu.", "tab_phone_d": "Jelajahi folder HP untuk mencari file.", "tab_rec_d": "Dengarkan rekaman yang sudah disimpan.", "s_start_t": "2. Mulai dan hapus vokal", "s_start_b1": "Pilih lagu lalu tekan \"{start}\".", "s_start_b2": "3 lagu baru pertamamu dimulai tanpa iklan. Setelah itu, pilih \"{watch_ad}\" atau \"{subscribe}\" untuk bebas iklan.", "s_start_b3": "AI menghapus vokal langsung di HP. Waktunya kira-kira sepanjang lagu, dan kamu bisa langsung memutar begitu bagian awal siap.", "s_play_t": "3. Layar pemutaran", "play_b1": "Tekan tombol merah muda besar untuk memutar atau berhenti.", "play_b2": "\"{vocal}\": nyalakan untuk mendengar suara asli sebagai panduan, matikan untuk bernyanyi hanya dengan instrumental.", "play_b3": "\"{show_score}\": jika aktif, kamu mendapat skor setiap selesai bernyanyi.", "play_b4": "Lirik bergerak mengikuti lagu. Ketuk ikon pensil untuk mengeditnya.", "s_rec_t": "4. Bernyanyi dan merekam", "s_rec_b": "Perekaman otomatis dimulai saat kamu memutar lagu. Gelombang merah adalah suaramu. Tekan tombolnya lagi untuk berhenti.", "s_score_t": "5. Lihat skormu", "s_score_b": "Jika \"{show_score}\" aktif, skor muncul di akhir setiap rekaman. Tekan \"{ok}\" untuk menutup.", "s_save_t": "6. Simpan rekamanmu", "save_b1": "Setelah merekam, ketuk tombol unduh di bagian bawah layar pemutaran.", "save_b2": "Gunakan panah untuk menyesuaikan sinkronisasi suaramu dengan instrumental.", "save_b3": "\"{save}\": menyimpan hasil campuran sebagai file audio di HP.", "save_b4": "\"{save_cloud}\": menyimpannya ke layanan cloud seperti Google Drive.", "save_b5": "Ketuk ikon pensil di samping judul untuk mengganti nama.", "s_lib_t": "7. Lagu yang tersimpan", "s_lib_b": "Lagu yang sudah dipisahkan otomatis tersimpan di tab \"{recent}\", jadi kamu tak perlu menunggu dua kali. Ketuk hati untuk menambahkan ke \"{favorites}\" atau tempat sampah untuk menghapus. Rekaman tersimpan bisa didengar di tab \"{recordings}\".", "s_faq_t": "Tips & Tanya jawab", "faq1": "Lirik: lirik yang ada di file MP3 akan ditampilkan. Untuk lirik yang sinkron, taruh file .lrc dengan nama yang sama di samping lagu.", "faq2": "Saat layar mati, proses jadi lebih lambat. Biarkan layar menyala agar lebih cepat selesai.", "faq3": "Privasi: lagu dan rekamanmu tetap di HP dan tidak pernah dikirim ke server kami.", "faq4": "Izin: aplikasi perlu akses ke musik untuk menampilkan lagu dan ke mikrofon untuk merekam.", "faq5": "Gunakan musik milikmu sendiri untuk latihan pribadi. Menyebarkan trek hasil pemisahan secara publik dapat melanggar hak cipta."}, "lab": {"start": "Mulai", "watch_ad": "Tonton Iklan untuk Mulai", "subscribe": "Berlangganan", "vocal": "Vokal", "show_score": "Tampilkan Skor", "save": "Simpan", "save_cloud": "Simpan ke Cloud", "recent": "Terbaru", "favorites": "Favorit", "all_songs": "Semua Lagu", "my_phone": "Dari HP Saya", "recordings": "Rekaman", "ok": "OK", "privacy": "Kebijakan Privasi"}, "img": {"02_allsongs": "img/id/02_allsongs.jpg", "03_gate": "img/id/03_gate.jpg", "04_play": "img/id/04_play.jpg", "05_playing": "img/id/05_playing.jpg", "07_export": "img/id/07_export.jpg", "01_recent": "img/id/01_recent.jpg"}, "rtl": false}, "ms": {"t": {"lang_name": "Bahasa Melayu", "title": "Panduan Dokebising", "subtitle": "Buang vokal daripada lagu dalam telefon anda dan nyanyi bersama muzik iringan.", "toc": "Kandungan", "select_lang": "Bahasa", "s_intro_t": "Apakah Dokebising?", "s_intro_b": "Dokebising menggunakan AI untuk memisahkan vokal daripada fail muzik dalam telefon anda dan hanya meninggalkan instrumental. Nyanyi sambil melihat lirik, rakam suara anda dan simpan versi cover anda sendiri. Semua diproses dalam telefon — muzik anda tidak pernah dimuat naik.", "s_pick_t": "1. Pilih lagu", "s_pick_b": "Pilih lagu daripada salah satu lima tab di bahagian atas skrin utama.", "tab_recent_d": "Lagu yang sudah dipisahkan. Dibuka serta-merta.", "tab_fav_d": "Lagu yang ditanda dengan hati.", "tab_all_d": "Semua fail muzik dalam telefon.", "tab_phone_d": "Layari folder telefon untuk mencari fail.", "tab_rec_d": "Dengar rakaman yang telah disimpan.", "s_start_t": "2. Mula dan buang vokal", "s_start_b1": "Pilih lagu dan tekan \"{start}\".", "s_start_b2": "3 lagu baharu pertama anda bermula tanpa iklan. Selepas itu, pilih \"{watch_ad}\" atau \"{subscribe}\" untuk penggunaan tanpa iklan.", "s_start_b3": "AI membuang vokal terus dalam telefon. Masanya lebih kurang sepanjang lagu, dan anda boleh mula memainkan sebaik sahaja bahagian awal siap.", "s_play_t": "3. Skrin main", "play_b1": "Tekan butang merah jambu besar untuk main atau berhenti.", "play_b2": "\"{vocal}\": hidupkan untuk mendengar suara asal sebagai panduan, matikan untuk menyanyi dengan instrumental sahaja.", "play_b3": "\"{show_score}\": jika dihidupkan, anda mendapat skor selepas setiap nyanyian.", "play_b4": "Lirik bergerak mengikut lagu. Ketik ikon pensel untuk menyunting.", "s_rec_t": "4. Nyanyi dan rakam", "s_rec_b": "Rakaman bermula secara automatik apabila anda menekan main. Gelombang merah ialah suara anda. Tekan butang sekali lagi untuk berhenti.", "s_score_t": "5. Lihat skor anda", "s_score_b": "Jika \"{show_score}\" dihidupkan, skor dipaparkan di akhir setiap rakaman. Tekan \"{ok}\" untuk menutup.", "s_save_t": "6. Simpan rakaman", "save_b1": "Selepas merakam, ketik butang muat turun di bahagian bawah skrin main.", "save_b2": "Gunakan anak panah untuk melaraskan penyegerakan suara dan iringan.", "save_b3": "\"{save}\": menyimpan campuran sebagai fail audio dalam telefon.", "save_b4": "\"{save_cloud}\": menyimpannya ke perkhidmatan awan seperti Google Drive.", "save_b5": "Ketik ikon pensel di sebelah tajuk untuk menukar nama.", "s_lib_t": "7. Lagu yang disimpan", "s_lib_b": "Lagu yang dipisahkan disimpan secara automatik dalam tab \"{recent}\", jadi anda tidak perlu menunggu lagi. Ketik hati untuk menambah ke \"{favorites}\" atau tong sampah untuk memadam. Rakaman yang disimpan boleh didengar dalam tab \"{recordings}\".", "s_faq_t": "Petua & Soalan lazim", "faq1": "Lirik: lirik dalam fail MP3 akan dipaparkan. Untuk lirik yang segerak, letakkan fail .lrc dengan nama yang sama di sebelah lagu.", "faq2": "Pemprosesan lebih perlahan apabila skrin dimatikan. Biarkan skrin hidup untuk hasil paling pantas.", "faq3": "Privasi: lagu dan rakaman anda kekal dalam telefon dan tidak pernah dihantar ke pelayan kami.", "faq4": "Kebenaran: aplikasi memerlukan akses kepada muzik untuk menyenaraikan lagu dan mikrofon untuk merakam.", "faq5": "Gunakan muzik milik anda sendiri untuk latihan peribadi sahaja. Mengedarkan trek yang dipisahkan secara umum boleh melanggar hak cipta."}, "lab": {"start": "Mula", "wat
