ecara umum boleh melanggar hak cipta."}, "lab": {"start": "Mula", "watch_ad": "Tonton Iklan untuk Bermula", "subscribe": "Langgan", "vocal": "Vokal", "show_score": "Papar Skor", "save": "Simpan", "save_cloud": "Simpan ke Awan", "recent": "Terkini", "favorites": "Kegemaran", "all_songs": "Semua Lagu", "my_phone": "Telefon Saya", "recordings": "Rakaman", "ok": "OK", "privacy": "Dasar Privasi"}, "img": {"02_allsongs": "img/ms/02_allsongs.jpg", "03_gate": "img/ms/03_gate.jpg", "04_play": "img/ms/04_play.jpg", "05_playing": "img/ms/05_playing.jpg", "07_export": "img/ms/07_export.jpg", "01_recent": "img/ms/01_recent.jpg"}, "rtl": false}, "fil": {"t": {"lang_name": "Filipino", "title": "Gabay sa Dokebising", "subtitle": "Tanggalin ang boses sa mga kanta sa phone mo at kumanta kasabay ng minus one.", "toc": "Nilalaman", "select_lang": "Wika", "s_intro_t": "Ano ang Dokebising?", "s_intro_b": "Gumagamit ang Dokebising ng AI para ihiwalay ang boses sa mga music file sa phone mo, kaya instrumental na lang ang natitira. Kumanta habang may lyrics, i-record ang boses mo, at i-save ang sarili mong cover. Lahat ay pinoproseso sa phone — hindi kailanman ina-upload ang musika mo.", "s_pick_t": "1. Pumili ng kanta", "s_pick_b": "Pumili ng kanta sa isa sa limang tab sa itaas ng main screen.", "tab_recent_d": "Mga kantang naihiwalay mo na. Agad itong bumubukas.", "tab_fav_d": "Mga kantang may puso.", "tab_all_d": "Lahat ng music file sa phone mo.", "tab_phone_d": "Mag-browse sa mga folder ng phone para maghanap ng file.", "tab_rec_d": "Pakinggan ang mga na-save mong recording.", "s_start_t": "2. Simulan at alisin ang boses", "s_start_b1": "Pumili ng kanta at pindutin ang \"{start}\".", "s_start_b2": "Ang unang 3 bagong kanta mo ay magsisimula nang walang ad. Pagkatapos nito, piliin ang \"{watch_ad}\" o \"{subscribe}\" para walang ad.", "s_start_b3": "Inaalis ng AI ang boses mismo sa phone. Halos kasinghaba ng kanta ang tagal, at puwede mo nang i-play kapag handa na ang unang bahagi.", "s_play_t": "3. Play screen", "play_b1": "Pindutin ang malaking pink na button para mag-play o huminto.", "play_b2": "\"{vocal}\": i-on para marinig ang orihinal na boses bilang gabay, i-off para kumanta sa instrumental lang.", "play_b3": "\"{show_score}\": kapag naka-on, may score ka sa bawat take.", "play_b4": "Sumasabay ang lyrics sa kanta. I-tap ang lapis para i-edit ito.", "s_rec_t": "4. Kumanta at mag-record", "s_rec_b": "Awtomatikong nagsisimula ang recording pag nag-play ka. Ang pulang waveform ay ang boses mo. Pindutin ulit ang button para huminto.", "s_score_t": "5. Tingnan ang score", "s_score_b": "Kapag naka-on ang \"{show_score}\", lalabas ang score sa dulo ng bawat take. Pindutin ang \"{ok}\" para isara.", "s_save_t": "6. I-save ang recording", "save_b1": "Pagkatapos mag-record, i-tap ang download button sa ibaba ng play screen.", "save_b2": "Gamitin ang mga arrow para ayusin ang sync ng boses mo at ng instrumental.", "save_b3": "\"{save}\": sine-save ang mix bilang audio file sa phone.", "save_b4": "\"{save_cloud}\": sine-save ito sa cloud service tulad ng Google Drive.", "save_b5": "I-tap ang lapis sa tabi ng pamagat para palitan ang pangalan.", "s_lib_t": "7. Mga naka-save na kanta", "s_lib_b": "Awtomatikong nase-save ang mga naihiwalay na kanta sa \"{recent}\" tab, kaya hindi ka na maghihintay ulit. I-tap ang puso para idagdag sa \"{favorites}\" o ang basurahan para burahin. Mapapakinggan ang mga na-save na recording sa \"{recordings}\" tab.", "s_faq_t": "Mga tip at FAQ", "faq1": "Lyrics: ipinapakita ang lyrics na nasa MP3 file. Para sa synced lyrics, maglagay ng .lrc file na kapareho ng pangalan sa tabi ng kanta.", "faq2": "Mas mabagal ang proseso kapag patay ang screen. Panatilihing bukas ang screen para mas mabilis.", "faq3": "Privacy: nananatili sa phone ang mga kanta at recording mo at hindi kailanman ipinapadala sa aming server.", "faq4": "Mga pahintulot: kailangan ng app ang access sa musika para ilista ang mga kanta at sa mikropono para mag-record.", "faq5": "Gumamit lang ng musikang pag-aari mo, para sa personal na practice. Maaaring lumabag sa copyright ang pagpapakalat ng mga nahiwalay na track."}, "lab": {"start": "Simulan", "watch_ad": "Manood ng Ad para Magsimula", "subscribe": "Mag-subscribe", "vocal": "Boses", "show_score": "Ipakita ang Puntos", "save": "I-save", "save_cloud": "I-save sa Cloud", "recent": "Kamakailan", "favorites": "Mga Paborito", "all_songs": "Lahat ng Kanta", "my_phone": "Aking Telepono", "recordings": "Mga Recording", "ok": "OK", "privacy": "Patakaran sa Privacy"}, "img": {"02_allsongs": "img/fil/02_allsongs.jpg", "03_gate": "img/fil/03_gate.jpg", "04_play": "img/fil/04_play.jpg", "05_playing": "img/fil/05_playing.jpg", "07_export": "img/fil/07_export.jpg", "01_recent": "img/fil/01_recent.jpg"}, "rtl": false}, "vi": {"t": {"lang_name": "Tiếng Việt", "title": "Hướng dẫn sử dụng Dokebising", "subtitle": "Tách giọng hát khỏi bài hát trong điện thoại và hát theo nhạc nền.", "toc": "Mục lục", "select_lang": "Ngôn ngữ", "s_intro_t": "Dokebising là gì?", "s_intro_b": "Dokebising dùng AI để tách giọng hát khỏi các tệp nhạc trong điện thoại, chỉ giữ lại phần nhạc nền. Hãy hát theo lời, thu âm giọng của bạn và lưu bản cover của riêng mình. Mọi xử lý diễn ra trên điện thoại — nhạc của bạn không bao giờ bị tải lên.", "s_pick_t": "1. Chọn bài hát", "s_pick_b": "Chọn bài hát ở một trong năm thẻ phía trên màn hình chính.", "tab_recent_d": "Bài hát đã tách. Mở ngay lập tức.", "tab_fav_d": "Bài hát bạn đã đánh dấu trái tim.", "tab_all_d": "Tất cả tệp nhạc trong điện thoại.", "tab_phone_d": "Duyệt thư mục điện thoại để tìm tệp.", "tab_rec_d": "Nghe lại các bản thu đã lưu.", "s_start_t": "2. Bắt đầu và tách giọng", "s_start_b1": "Chọn bài hát rồi nhấn \"{start}\".", "s_start_b2": "3 bài hát mới đầu tiên được bắt đầu không có quảng cáo. Sau đó, chọn \"{watch_ad}\" hoặc \"{subscribe}\" để dùng không quảng cáo.", "s_start_b3": "AI tách giọng ngay trên điện thoại. Thời gian khoảng bằng độ dài bài hát, và bạn có thể phát ngay khi phần đầu đã sẵn sàng.", "s_play_t": "3. Màn hình phát", "play_b1": "Nhấn nút hồng lớn để phát hoặc dừng.", "play_b2": "\"{vocal}\": bật để nghe giọng gốc làm hướng dẫn, tắt để chỉ hát với nhạc nền.", "play_b3": "\"{show_score}\": khi bật, bạn nhận điểm sau mỗi lần hát.", "play_b4": "Lời bài hát chạy theo nhạc. Chạm vào bút chì để chỉnh sửa.", "s_rec_t": "4. Hát và thu âm", "s_rec_b": "Thu âm tự động bắt đầu khi bạn nhấn phát. Dạng sóng màu đỏ là giọng của bạn. Nhấn nút lần nữa để dừng.", "s_score_t": "5. Xem điểm", "s_score_b": "Khi \"{show_score}\" được bật, điểm sẽ hiện khi kết thúc mỗi lần hát. Nhấn \"{ok}\" để đóng.", "s_save_t": "6. Lưu bản thu", "save_b1": "Sau khi thu, chạm nút tải xuống ở cuối màn hình phát.", "save_b2": "Dùng các mũi tên để căn chỉnh đồng bộ giữa giọng và nhạc nền.", "save_b3": "\"{save}\": lưu bản phối thành tệp âm thanh trên điện thoại.", "save_b4": "\"{save_cloud}\": lưu lên dịch vụ đám mây như Google Drive.", "save_b5": "Chạm bút chì cạnh tiêu đề để đổi tên.", "s_lib_t": "7. Bài hát đã lưu", "s_lib_b": "Bài hát đã tách được tự động lưu vào thẻ \"{recent}\", nên bạn không phải chờ lần thứ hai. Chạm trái tim để thêm vào \"{favorites}\" hoặc thùng rác để xoá. Bản thu đã lưu có thể nghe trong thẻ \"{recordings}\".", "s_faq_t": "Mẹo & câu hỏi thường gặp", "faq1": "Lời bài hát: lời có sẵn trong tệp MP3 sẽ được hiển thị. Để lời chạy đồng bộ, đặt tệp .lrc cùng tên bên cạnh bài hát.", "faq2": "Khi tắt màn hình, quá trình xử lý chậm hơn. Hãy để màn hình bật để nhanh nhất.", "faq3": "Quyền riêng tư: bài hát và bản thu của bạn chỉ nằm trên điện thoại và không bao giờ được gửi tới máy chủ của chúng tôi.", "faq4": "Quyền truy cập: ứng dụng cần quyền truy cập nhạc để liệt kê bài hát và micro để thu âm.", "faq5": "Vui lòng dùng nhạc bạn sở hữu và chỉ để luyện tập cá nhân. Phát tán công khai bản nhạc đã tách có thể vi phạm bản quyền."}, "lab": {"start": "Bắt đầu", "watch_ad": "Xem quảng cáo để bắt đầu", "subscribe": "Đăng ký", "vocal": "Giọng hát", "show_score": "Hiện điểm", "save": "Lưu", "save_cloud": "Lưu lên đám mây", "recent": "Gần đây", "favorites": "Yêu thích", "all_songs": "Tất cả bài hát", "my_phone": "Điện thoại của tôi", "recordings": "Bản thu âm", "ok": "OK", "privacy": "Chính sách quyền riêng tư"}, "img": {"02_allsongs": "img/vi/02_allsongs.jpg", "03_gate": "img/vi/03_gate.jpg", "04_play": "img/vi/04_play.jpg", "05_playing": "img/vi/05_playing.jpg", "07_export": "img/vi/07_export.jpg", "01_recent": "img/vi/01_recent.jpg"}, "rtl": false}, "th": {"t": {"lang_name": "ไทย", "title": "คู่มือการใช้งาน Dokebising", "subtitle": "ลบเสียงร้องออกจากเพลงในมือถือ แล้วร้องตามดนตรีได้เลย", "toc": "สารบัญ", "select_lang": "ภาษา", "s_intro_t": "Dokebising คืออะไร", "s_intro_b": "Dokebising ใช้ AI แยกเสียงร้องออกจากไฟล์เพลงในมือถือของคุณ เหลือไว้เฉพาะดนตรี คุณสามารถร้องตามเนื้อเพลง อัดเสียงของตัวเอง และบันทึกเป็นเพลงคัฟเวอร์ของคุณ ทุกอย่างประมวลผลในมือถือ เพลงของคุณจะไม่ถูกอัปโหลด", "s_pick_t": "1. เลือกเพลง", "s_pick_b": "เลือกเพลงจากแท็บใดแท็บหนึ่งในห้าแท็บด้านบนของหน้าจอหลัก", "tab_recent_d": "เพลงที่แยกเสียงแล้ว เปิดได้ทันที", "tab_fav_d": "เพลงที่คุณกดหัวใจไว้", "tab_all_d": "ไฟล์เพลงทั้งหมดในมือถือ", "tab_phone_d": "เปิดดูโฟลเดอร์ในมือถือเพื่อหาไฟล์", "tab_rec_d": "ฟังไฟล์อัดเสียงที่บันทึกไว้", "s_start_t": "2. เริ่มและลบเสียงร้อง", "s_start_b1": "เลือกเพลงแล้วกด \"{start}\"", "s_start_b2": "เพลงใหม่ 3 เพลงแรกเริ่มได้โดยไม่มีโฆษณา หลังจากนั้นเลือก \"{watch_ad}\" หรือ \"{subscribe}\" เพื่อใช้งานแบบไม่มีโฆษณา", "s_start_b3": "AI ลบเสียงร้องบนมือถือโดยตรง ใช้เวลาประมาณความยาวเพลง และเล่นได้ทันทีเมื่อช่วงแรกพร้อม", "s_play_t": "3. หน้าจอเล่นเพลง", "play_b1": "กดปุ่มสีชมพูขนาดใหญ่เพื่อเล่นหรือหยุด", "play_b2": "\"{vocal}\": เปิดเพื่อฟังเสียงร้องต้นฉบับเป็นไกด์ ปิดเพื่อร้องกับดนตรีอย่างเดียว", "play_b3": "\"{show_score}\": เมื่อเปิด คุณจะได้คะแนนทุกครั้งที่ร้องจบ", "play_b4": "เนื้อเพลงเลื่อนตามเพลง แตะรูปดินสอเพื่อแก้ไข", "s_rec_t": "4. ร้องและอัดเสียง", "s_rec_b": "การอัดเสียงเริ่มอัตโนมัติเมื่อกดเล่น คลื่นเสียงสีแดงคือเสียงของคุณ กดปุ่มอีกครั้งเพื่อหยุด", "s_score_t": "5. ดูคะแนน", "s_score_b": "เมื่อเปิด \"{show_score}\" คะแนนจะแสดงเมื่อร้องจบแต่ละครั้ง กด \"{ok}\" เพื่อปิด", "s_save_t": "6. บันทึกเสียงที่อัด", "save_b1": "หลังอัดเสียง แตะปุ่มดาวน์โหลดที่ด้านล่างของหน้าจอเล่นเพลง", "save_b2": "ใช้ลูกศรปรับจังหวะเสียงร้องให้ตรงกับดนตรี", "save_b3": "\"{save}\": บันทึกเพลงที่มิกซ์แล้วเป็นไฟล์เสียงในมือถือ", "save_b4": "\"{save_cloud}\": บันทึกไปยังคลาวด์ เช่น Google Drive", "save_b5": "แตะรูปดินสอข้างชื่อเพื่อเปลี่ยนชื่อ", "s_lib_t": "7. เพลงที่บันทึกไว้", "s_lib_b": "เพลงที่แยกแล้วจะถูกบันทึกในแท็บ \"{recent}\" โดยอัตโนมัติ จึงไม่ต้องรอซ้ำ แตะหัวใจเพื่อเพิ่มใน \"{favorites}\" หรือแตะถังขยะเพื่อลบ ฟังไฟล์อัดเสียงที่บันทึกไว้ได้ในแท็บ \"{recordings}\"", "s_faq_t": "เคล็ดลับและคำถามที่พบบ่อย", "faq1": "เนื้อเพลง: แสดงเนื้อเพลงที่ฝังอยู่ในไฟล์ MP3 หากต้องการเนื้อเพลงที่เลื่อนตามจังหวะ ให้วางไฟล์ .lrc ชื่อเดียวกันไว้ข้างเพลง", "faq2": "เมื่อปิดหน้าจอ การประมวลผลจะช้าลง เปิดหน้าจอไว้เพื่อให้เสร็จเร็วที่สุด", "faq3": "ความเป็นส่วนตัว: เพลงและไฟล์อัดเสียงของคุณอยู่ในมือถือเท่านั้น และไม่ถูกส่งไปยังเซิร์ฟเวอร์ของเรา", "faq4": "สิทธิ์: แอปต้องเข้าถึงเพลงเพื่อแสดงรายการเพลง และเข้าถึงไมโครโฟนเพื่ออัดเสียง", "faq5": "โปรดใช้เพลงที่คุณเป็นเจ้าของเพื่อการฝึกซ้อมส่วนตัวเท่านั้น การเผยแพร่แทร็กที่แยกแล้วต่อสาธารณะอาจละเมิดลิขสิทธิ์"}, "lab": {"start": "เริ่ม", "watch_ad": "ดูโฆษณาเพื่อเริ่ม", "subscribe": "สมัครสมาชิก", "vocal": "เสียงร้อง", "show_score": "แสดงคะแนน", "save": "บันทึก", "save_cloud": "บันทึกบนคลาวด์", "recent": "ล่าสุด", "favorites": "รายการโปรด", "all_songs": "เพลงทั้งหมด", "my_phone": "โทรศัพท์ของฉัน", "recordings": "รายการบันทึกเสียง", "ok": "ตกลง", "privacy": "นโยบายความเป็นส่วนตัว"}, "img": {"02_allsongs": "img/th/02_allsongs.jpg", "03_gate": "img/th/03_gate.jpg", "04_play": "img/th/04_play.jpg", "05_playing": "img/th/05_playing.jpg", "07_export": "img/th/07_export.jpg", "01_recent": "img/th/01_recent.jpg"}, "rtl": false}, "tr-TR": {"t": {"lang_name": "Türkçe", "title": "Dokebising Kullanım Kılavuzu", "subtitle": "Telefonundaki şarkılardan vokali kaldır ve altyapıyla söyle.", "toc": "İçindekiler", "select_lang": "Dil", "s_intro_t": "Dokebising nedir?", "s_intro_b": "Dokebising, telefonundaki müzik dosyalarından vokali yapay zekayla ayırır ve yalnızca enstrümantali bırakır. Sözlere bakarak söyle, sesini kaydet ve kendi cover'ını kaydet. Her şey telefonda işlenir — müziğin asla yüklenmez.", "s_pick_t": "1. Şarkı seç", "s_pick_b": "Ana ekranın üstündeki beş sekmeden birinden şarkı seç.", "tab_recent_d": "Daha önce ayrılmış şarkılar. Hemen açılır.", "tab_fav_d": "Kalple işaretlediğin şarkılar.", "tab_all_d": "Telefonundaki tüm müzik dosyaları.", "tab_phone_d": "Dosya bulmak için telefonun klasörlerine göz at.", "tab_rec_d": "Kaydettiğin kayıtları dinle.", "s_start_t": "2. Başlat ve vokali kaldır", "s_start_b1": "Bir şarkı seç ve \"{start}\" düğmesine bas.", "s_start_b2": "İlk 3 yeni şarkın reklamsız başlar. Sonrasında \"{watch_ad}\" ya da reklamsız kullanım için \"{subscribe}\" seçeneğini kullan.", "s_start_b3": "Yapay zeka vokali doğrudan telefonda kaldırır. Yaklaşık şarkı süresi kadar sürer ve ilk bölüm hazır olur olmaz çalmaya başlayabilirsin.", "s_play_t": "3. Oynatma ekranı", "play_b1": "Çalmak veya durdurmak için büyük pembe düğmeye bas.", "play_b2": "\"{vocal}\": açıkken orijinal ses rehber olarak duyulur, kapalıyken yalnızca altyapı çalar.", "play_b3": "\"{show_score}\": açıkken her denemeden sonra puan alırsın.", "play_b4": "Sözler şarkıyla birlikte akar. Düzenlemek için kaleme dokun.", "s_rec_t": "4. Söyle ve kaydet", "s_rec_b": "Oynatmaya bastığında kayıt otomatik başlar. Kırmızı dalga senin sesindir. Durdurmak için düğmeye tekrar bas.", "s_score_t": "5. Puanını gör", "s_score_b": "\"{show_score}\" açıksa her denemenin sonunda puanın görünür. Kapatmak için \"{ok}\" düğmesine bas.", "s_save_t": "6. Kaydını sakla", "save_b1": "Kayıttan sonra oynatma ekranının altındaki indirme düğmesine dokun.", "save_b2": "Sesinle altyapının senkronunu oklarla ince ayarla.", "save_b3": "\"{save}\": karışımı telefonuna ses dosyası olarak kaydeder.", "save_b4": "\"{save_cloud}\": Google Drive gibi bir bulut hizmetine kaydeder.", "save_b5": "Adını değiştirmek için başlığın yanındaki kaleme dokun.", "s_lib_t": "7. Kayıtlı şarkıların", "s_lib_b": "Ayrılan şarkılar otomatik olarak \"{recent}\" sekmesine kaydedilir, böylece ikinci kez beklemezsin. Kalbe dokunarak \"{favorites}\" sekmesine ekle, çöp kutusuyla sil. Kaydettiğin kayıtları \"{recordings}\" sekmesinde dinleyebilirsin.", "s_faq_t": "İpuçları ve SSS", "faq1": "Şarkı sözleri: MP3 dosyasındaki sözler gösterilir. Senkronize sözler için şarkının yanına aynı adlı bir .lrc dosyası koy.", "faq2": "Ekran kapalıyken işlem daha yavaştır. En hızlı sonuç için ekranı açık tut.", "faq3": "Gizlilik: şarkıların ve kayıtların telefonunda kalır, asla sunucularımıza gönderilmez.", "faq4": "İzinler: Uygulamanın şarkıları listelemek için müziğe, kayıt için mikrofona erişmesi gerekir.", "faq5": "Lütfen yalnızca sahip olduğun müzikleri kişisel pratik için kullan. Ayrılmış parçaları herkese açık paylaşmak telif haklarını ihlal edebilir."}, "lab": {"start": "Başlat", "watch_ad": "Başlamak İçin Reklam İzle", "subscribe": "Abone Ol", "vocal": "Vokal", "show_score": "Puanı Göster", "save": "Kaydet", "save_cloud": "Buluta Kaydet", "recent": "Son Kullanılanlar", "favorites": "Favoriler", "all_songs": "Tüm Şarkılar", "my_phone": "Telefonum", "recordings": "Kayıtlar", "ok": "Tamam", "privacy": "Gizlilik Politikası"}, "img": {"02_allsongs": "img/tr-TR/02_allsongs.jpg", "03_gate": "img/tr-TR/03_gate.jpg", "04_play": "img/tr-TR/04_play.jpg", "05_playing": "img/tr-TR/05_playing.jpg", "07_export": "img/tr-TR/07_export.jpg", "01_recent": "img/tr-TR/01_recent.jpg"}, "rtl": false}, "ar": {"t": {"lang_name": "العربية", "title": "دليل استخدام Dokebising", "subtitle": "أزل صوت المغني من الأغاني على هاتفك وغنِّ مع الموسيقى.", "toc": "المحتويات", "select_lang": "اللغة", "s_intro_t": "ما هو Dokebising؟", "s_intro_b": "يستخدم Dokebising الذكاء الاصطناعي لفصل صوت المغني عن ملفات الموسيقى على هاتفك، فلا يبقى إلا اللحن الموسيقي. غنِّ مع الكلمات، وسجّل صوتك، واحفظ نسختك الخاصة. تتم المعالجة بالكامل على هاتفك، ولا تُرفع موسيقاك أبدًا.", "s_pick_t": "1. اختر أغنية", "s_pick_b": "اختر أغنية من إحدى علامات التبويب الخمس أعلى الشاشة الرئيسية.", "tab_recent_d": "أغانٍ سبق فصلها، تُفتح فورًا.", "tab_fav_d": "الأغاني التي ميّزتها بالقلب.", "tab_all_d": "جميع ملفات الموسيقى على هاتفك.", "tab_phone_d": "تصفّح مجلدات الهاتف للعثور على ملف.", "tab_rec_d": "استمع إلى التسجيلات التي حفظتها.", "s_start_t": "2. ابدأ وأزل الصوت", "s_start_b1": "اختر أغنية ثم اضغط «{start}».", "s_start_b2": "أول 3 أغانٍ جديدة تبدأ بدون إعلانات. بعد ذلك اختر «{watch_ad}» أو «{subscribe}» للاستخدام بدون إعلانات.", "s_start_b3": "يزيل الذكاء الاصطناعي الصوت على هاتفك مباشرة، ويستغرق ذلك تقريبًا مدة الأغنية، ويمكنك التشغيل بمجرد جاهزية الجزء الأول.", "s_play_t": "3. شاشة التشغيل", "play_b1": "اضغط الزر الوردي الكبير للتشغيل أو الإيقاف.", "play_b2": "«{vocal}»: شغّله لتسمع صوت المغني الأصلي كمرشد، وأوقفه لتغني مع الموسيقى وحدها.", "play_b3": "«{show_score}»: عند تفعيله تحصل على نتيجة بعد كل محاولة.", "play_b4": "تتحرك الكلمات مع الأغنية. اضغط على القلم لتعديلها.", "s_rec_t": "4. غنِّ وسجّل", "s_rec_b": "يبدأ التسجيل تلقائيًا عند التشغيل. الموجة الحمراء هي صوتك. اضغط الزر مرة أخرى للإيقاف.", "s_score_t": "5. اطّلع على نتيجتك", "s_score_b": "عند تفعيل «{show_score}» تظهر نتيجتك في نهاية كل محاولة. اضغط «{ok}» للإغلاق.", "s_save_t": "6. احفظ تسجيلك", "save_b1": "بعد التسجيل، اضغط زر التنزيل أسفل شاشة التشغيل.", "save_b2": "استخدم الأسهم لضبط التزامن بين صوتك والموسيقى.", "save_b3": "«{save}»: يحفظ المزيج كملف صوتي على هاتفك.", "save_b4": "«{save_cloud}»: يحفظه في خدمة سحابية مثل Google Drive.", "save_b5": "اضغط على القلم بجوار العنوان لإعادة التسمية.", "s_lib_t": "7. أغانيك المحفوظة", "s_lib_b": "تُحفظ الأغاني المفصولة تلقائيًا في تبويب «{recent}»، فلن تنتظر مرتين. اضغط القلب لإضافتها إلى «{favorites}» أو سلة المهملات لحذفها. يمكنك الاستماع إلى التسجيلات المحفوظة في تبويب «{recordings}».", "s_faq_t": "نصائح وأسئلة شائعة", "faq1": "الكلمات: تُعرض الكلمات المضمّنة في ملف MP3. لعرض كلمات متزامنة، ضع ملف ‎.lrc‎ بالاسم نفسه بجوار الأغنية.", "faq2": "تكون المعالجة أبطأ عندما تكون الشاشة مطفأة. أبقِ الشاشة مضاءة لأسرع نتيجة.", "faq3": "الخصوصية: تبقى أغانيك وتسجيلاتك على هاتفك ولا تُرسل أبدًا إلى خوادمنا.", "faq4": "الأذونات: يحتاج التطبيق إلى الوصول إلى الموسيقى لعرض الأغاني وإلى الميكروفون للتسجيل.", "faq5": "يُرجى استخدام موسيقى تملكها وللتدريب الشخصي فقط. قد يُعدّ نشر المقاطع المفصولة علنًا انتهاكًا لحقوق النشر."}, "lab": {"start": "بدء", "watch_ad": "شاهد الإعلان للبدء", "subscribe": "اشترك", "vocal": "الصوت", "show_score": "إظهار النتيجة", "save": "حفظ", "save_cloud": "حفظ في السحابة", "recent": "الأحدث", "favorites": "المفضلة", "all_songs": "جميع الأغاني", "my_phone": "من هاتفي", "recordings": "التسجيلات", "ok": "موافق", "privacy": "سياسة الخصوصية"}, "img": {"02_allsongs": "img/ar/02_allsongs.jpg", "03_gate": "img/ar/03_gate.jpg", "04_play": "img/ar/04_play.jpg", "05_playing": "img/ar/05_playing.jpg", "07_export": "img/ar/07_export.jpg", "01_recent": "img/ar/01_recent.jpg"}, "rtl": true}, "fa": {"t": {"lang_name": "فارسی", "title": "راهنمای Dokebising", "subtitle": "صدای خواننده را از آهنگ‌های گوشی حذف کنید و همراه موسیقی بخوانید.", "toc": "فهرست", "select_lang": "زبان", "s_intro_t": "Dokebising چیست؟", "s_intro_b": "Dokebising با هوش مصنوعی صدای خواننده را از فایل‌های موسیقی گوشی شما جدا می‌کند و فقط بی‌کلام را باقی می‌گذارد. همراه متن ترانه بخوانید، صدایتان را ضبط کنید و نسخهٔ خودتان را ذخیره کنید. همه‌چیز روی گوشی پردازش می‌شود و موسیقی شما هرگز آپلود نمی‌شود.", "s_pick_t": "۱. یک آهنگ انتخاب کنید", "s_pick_b": "از یکی از پنج زبانهٔ بالای صفحهٔ اصلی آهنگی انتخاب کنید.", "tab_recent_d": "آهنگ‌هایی که قبلاً جدا شده‌اند و فوراً باز می‌شوند.", "tab_fav_d": "آهنگ‌هایی که با قلب علامت زده‌اید.", "tab_all_d": "همهٔ فایل‌های موسیقی گوشی.", "tab_phone_d": "پوشه‌های گوشی را برای یافتن فایل مرور کنید.", "tab_rec_d": "ضبط‌های ذخیره‌شده را گوش دهید.", "s_start_t": "۲. شروع و حذف صدا", "s_start_b1": "آهنگی را انتخاب کنید و «{start}» را بزنید.", "s_start_b2": "۳ آهنگ جدید اول بدون تبلیغ شروع می‌شوند. پس از آن «{watch_ad}» یا برای استفادهٔ بدون تبلیغ «{subscribe}» را انتخاب کنید.", "s_start_b3": "هوش مصنوعی صدا را مستقیماً روی گوشی حذف می‌کند. تقریباً به اندازهٔ طول آهنگ زمان می‌برد و به محض آماده‌شدن بخش اول می‌توانید پخش کنید.", "s_play_t": "۳. صفحهٔ پخش", "play_b1": "دکمهٔ صورتی بزرگ را برای پخش یا توقف بزنید.", "play_b2": "«{vocal}»: روشن باشد صدای اصلی خواننده به‌عنوان راهنما پخش می‌شود و خاموش باشد فقط بی‌کلام.", "play_b3": "«{show_score}»: اگر روشن باشد، بعد از هر بار خواندن امتیاز می‌گیرید.", "play_b4": "متن ترانه همراه آهنگ پیش می‌رود. برای ویرایش روی مداد بزنید.", "s_rec_t": "۴. بخوانید و ضبط کنید", "s_rec_b": "با زدن پخش، ضبط خودکار شروع می‌شود. موج قرمز صدای شماست. برای توقف دوباره دکمه را بزنید.", "s_score_t": "۵. امتیازتان را ببینید", "s_score_b": "اگر «{show_score}» روشن باشد، در پایان هر بار خواندن امتیاز نمایش داده می‌شود. برای بستن «{ok}» را بزنید.", "s_save_t": "۶. ضبط را ذخیره کنید", "save_b1": "پس از ضبط، دکمهٔ دانلود پایین صفحهٔ پخش را بزنید.", "save_b2": "با فلش‌ها هماهنگی صدای خود و بی‌کلام را دقیق تنظیم کنید.", "save_b3": "«{save}»: میکس را به‌صورت فایل صوتی روی گوشی ذخیره می‌کند.", "save_b4": "«{save_cloud}»: آن را در سرویس ابری مثل Google Drive ذخیره می‌کند.", "save_b5": "برای تغییر نام، روی مداد کنار عنوان بزنید.", "s_lib_t": "۷. آهنگ‌های ذخیره‌شده", "s_lib_b": "آهنگ‌های جداشده به‌طور خودکار در زبانهٔ «{recent}» ذخیره می‌شوند، پس دیگر لازم نیست دوباره منتظر بمانید. با قلب به «{favorites}» اضافه کنید یا با سطل زباله حذف کنید. ضبط‌های ذخیره‌شده را در زبانهٔ «{recordings}» گوش دهید.", "s_faq_t": "نکته‌ها و پرسش‌های رایج", "faq1": "متن ترانه: متن موجود در فایل MP3 نمایش داده می‌شود. برای متن هم‌زمان، یک فایل ‎.lrc‎ با همان نام کنار آهنگ قرار دهید.", "faq2": "وقتی صفحه خاموش است پردازش کندتر است. برای سریع‌ترین نتیجه صفحه را روشن نگه دارید.", "faq3": "حریم خصوصی: آهنگ‌ها و ضبط‌های شما فقط روی گوشی می‌مانند و هرگز به سرورهای ما ارسال نمی‌شوند.", "faq4": "مجوزها: برنامه برای نمایش آهنگ‌ها به دسترسی موسیقی و برای ضبط به میکروفون نیاز دارد.", "faq5": "لطفاً فقط از موسیقی متعلق به خودتان و برای تمرین شخصی استفاده کنید. انتشار عمومی قطعات جداشده ممکن است نقض حق نشر باشد."}, "lab": {"start": "شروع", "watch_ad": "تماشای تبلیغ و شروع", "subscribe": "خرید اشتراک", "vocal": "صدای خواننده", "show_score": "نمایش امتیاز", "save": "ذخیره", "save_cloud": "ذخیره در فضای ابری", "recent": "اخیر", "favorites": "علاقه‌مندی‌ها", "all_songs": "همهٔ آهنگ‌ها", "my_phone": "تلفن من", "recordings": "ضبط‌ها", "ok": "تأیید", "privacy": "سیاست حفظ حریم خصوصی"}, "img": {"02_allsongs": "img/fa/02_allsongs.jpg", "03_gate": "img/fa/03_gate.jpg", "04_play": "img/fa/04_play.jpg", "05_playing": "img/fa/05_playing.jpg", "07_export": "img/fa/07_export.jpg", "01_recent": "img/fa/01_recent.jpg"}, "rtl": true}, "hi-IN": {"t": {"lang_name": "हिन्दी", "title": "Dokebising उपयोग गाइड", "subtitle": "अपने फ़ोन के गानों से आवाज़ हटाएँ और संगीत के साथ गाएँ।", "toc": "विषय-सूची", "select_lang": "भाषा", "s_intro_t": "Dokebising क्या है?", "s_intro_b": "Dokebising AI से आपके फ़ोन की म्यूज़िक फ़ाइलों से गायक की आवाज़ अलग करता है और सिर्फ़ संगीत छोड़ता है। बोल देखकर गाएँ, अपनी आवाज़ रिकॉर्ड करें और अपना कवर सेव करें। सारा काम फ़ोन पर ही होता है — आपका संगीत कभी अपलोड नहीं होता।", "s_pick_t": "1. गाना चुनें", "s_pick_b": "मुख्य स्क्रीन के ऊपर पाँच टैब में से किसी एक से गाना चुनें।", "tab_recent_d": "जिन गानों की आवाज़ पहले ही अलग हो चुकी है। तुरंत खुलते हैं।", "tab_fav_d": "जिन गानों पर आपने दिल लगाया है।", "tab_all_d": "फ़ोन की सभी म्यूज़िक फ़ाइलें।", "tab_phone_d": "फ़ाइल ढूँढने के लिए फ़ोन के फ़ोल्डर देखें।", "tab_rec_d": "सेव की गई रिकॉर्डिंग सुनें।", "s_start_t": "2. शुरू करें और आवाज़ हटाएँ", "s_start_b1": "गाना चुनें और \"{start}\" दबाएँ।", "s_start_b2": "पहले 3 नए गाने बिना विज्ञापन शुरू होते ροσπάθεια.", "play_b4": "Οι στίχοι κυλούν μαζί με το τραγούδι. Πάτησε το μολύβι για επεξεργασία.", "s_rec_t": "4. Τραγούδα και ηχογράφησε", "s_rec_b": "Η ηχογράφηση ξεκινά αυτόματα με την αναπαραγωγή. Η κόκκινη κυματομορφή είναι η φωνή σου. Πάτησε ξανά το κουμπί για διακοπή.", "s_score_t": "5. Δες τη βαθμολογία σου", "s_score_b": "Με το «{show_score}» ενεργό, η βαθμολογία εμφανίζεται στο τέλος κάθε προσπάθειας. Πάτησε «{ok}» για κλείσιμο.", "s_save_t": "6. Αποθήκευσε την ηχογράφηση", "save_b1": "Μετά την ηχογράφηση, πάτησε το κουμπί λήψης στο κάτω μέρος της οθόνης αναπαραγωγής.", "save_b2": "Με τα βέλη ρύθμισε τον συγχρονισμό φωνής και μουσικής.", "save_b3": "«{save}»: αποθηκεύει τη μίξη ως αρχείο ήχου στο κινητό.", "save_b4": "«{save_cloud}»: την αποθηκεύει σε υπηρεσία cloud όπως το Google Drive.", "save_b5": "Πάτησε το μολύβι δίπλα στον τίτλο για μετονομασία.", "s_lib_t": "7. Αποθηκευμένα τραγούδια", "s_lib_b": "Τα διαχωρισμένα τραγούδια αποθηκεύονται αυτόματα στην καρτέλα «{recent}», οπότε δεν περιμένεις ποτέ δεύτερη φορά. Πάτησε την καρδιά για να το προσθέσεις στα «{favorites}» ή τον κάδο για διαγραφή. Τις αποθηκευμένες ηχογραφήσεις τις ακούς στην καρτέλα «{recordings}».", "s_faq_t": "Συμβουλές & συχνές ερωτήσεις", "faq1": "Στίχοι: εμφανίζονται οι στίχοι που περιέχει το αρχείο MP3. Για συγχρονισμένους στίχους, βάλε ένα αρχείο .lrc με το ίδιο όνομα δίπλα στο τραγούδι.", "faq2": "Με κλειστή οθόνη η επεξεργασία είναι πιο αργή. Κράτα την οθόνη ανοιχτή για το γρηγορότερο αποτέλεσμα.", "faq3": "Απόρρητο: τα τραγούδια και οι ηχογραφήσεις σου μένουν στο κινητό και δεν στέλνονται ποτέ στους διακομιστές μας.", "faq4": "Άδειες: η εφαρμογή χρειάζεται πρόσβαση στη μουσική για να εμφανίσει τα τραγούδια και στο μικρόφωνο για ηχογράφηση.", "faq5": "Χρησιμοποίησε μόνο μουσική που σου ανήκει και μόνο για προσωπική εξάσκηση. Η δημόσια διανομή διαχωρισμένων κομματιών μπορεί να παραβιάζει πνευματικά δικαιώματα."}, "lab": {"start": "Έναρξη", "watch_ad": "Δείτε διαφήμιση για έναρξη",
